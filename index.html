<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>iField AI — Premium Cosmic Landing Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%239b4dff'>⚡</text></svg>">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:#000;color:#fff;overflow-x:hidden;min-height:100vh}
  
  /* PREMIUM COSMOS CANVAS */
  #spaceCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    display:block;
    background:radial-gradient(ellipse at center,#050510,#000000);
  }
  
  /* GLOW EFFECTS */
  .edge-glow{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:1;
    box-shadow:inset 0 0 120px rgba(64,224,208,0.15),inset 0 0 180px rgba(155,77,255,0.1);
  }
  
  /* MAIN CONTAINER */
  .container{
    max-width:720px;
    margin:0 auto;
    position:relative;
    z-index:10;
    padding:20px;
  }
  
  .glitch-logo{
    position:fixed;
    top:20px;
    left:20px;
    font-size:26px;
    font-weight:700;
    background:linear-gradient(135deg,#40E0D0,#9b4dff,#ff44aa);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    pointer-events:none;
    z-index:100;
    letter-spacing:-0.5px;
  }
  
  /* TABS */
  .mode-tabs{
    display:flex;
    gap:8px;
    margin:60px 0 20px;
    background:rgba(20,28,40,0.5);
    backdrop-filter:blur(20px);
    border-radius:60px;
    padding:6px;
    border:0.5px solid rgba(155,77,255,0.2);
  }
  .mode-btn{
    flex:1;
    text-align:center;
    padding:12px 0;
    border-radius:50px;
    background:transparent;
    border:none;
    color:#a0b0d0;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
  }
  .mode-btn.active{
    background:linear-gradient(135deg,#40E0D0,#9b4dff);
    color:#fff;
    box-shadow:0 4px 20px rgba(64,224,208,0.4);
  }
  
  /* FIELDS */
  .field{margin-bottom:20px}
  .field input,.field textarea,.field select{
    width:100%;
    background:rgba(20,28,40,0.7);
    backdrop-filter:blur(20px);
    border:1px solid rgba(155,77,255,0.3);
    border-radius:20px;
    padding:14px 18px;
    color:#fff;
    font-size:15px;
    transition:all 0.2s;
  }
  .field input:focus,.field textarea:focus{
    outline:none;
    border-color:#40E0D0;
    box-shadow:0 0 20px rgba(64,224,208,0.3);
  }
  .field label{
    font-size:12px;
    color:#b07cff;
    margin-bottom:6px;
    display:block;
    letter-spacing:0.3px;
  }
  
  /* PREMIUM BUTTONS */
  .hero-btn{
    width:100%;
    background:linear-gradient(135deg,#40E0D0,#9b4dff);
    border:none;
    border-radius:60px;
    padding:18px;
    font-size:18px;
    font-weight:600;
    color:#fff;
    cursor:pointer;
    margin:16px 0;
    position:relative;
    overflow:hidden;
    transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1.1);
    box-shadow:0 0 30px rgba(64,224,208,0.3);
  }
  .hero-btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
    transition:left 0.5s;
  }
  .hero-btn:hover::before{left:100%}
  .hero-btn:hover{transform:scale(1.02);box-shadow:0 0 40px rgba(64,224,208,0.6)}
  
  .improve-btn{
    background:linear-gradient(135deg,#ffaa33,#ff6600);
    box-shadow:0 0 20px rgba(255,102,0,0.3);
  }
  
  .additional-toggle{
    text-align:center;
    margin:12px;
    color:#8a9ac0;
    cursor:pointer;
    font-size:13px;
  }
  .additional-options{display:none;margin-bottom:20px}
  .additional-options.open{display:block}
  
  .limits{
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(20px);
    border-radius:40px;
    padding:12px 16px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    font-size:12px;
    margin:20px 0;
    border:0.5px solid rgba(155,77,255,0.2);
  }
  .limit-free{color:#22c55e;font-weight:bold}
  .pro-buy-btn{
    background:linear-gradient(135deg,#ffd700,#ffb347);
    color:#1a1a2e;
    border:none;
    padding:6px 16px;
    border-radius:40px;
    cursor:pointer;
    font-weight:bold;
  }
  
  /* RESULT */
  .result-section{display:none;margin-top:32px}
  .preview-frame{
    width:100%;
    height:500px;
    border:none;
    border-radius:28px;
    background:#05070c;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
  }
  .action-buttons{
    display:flex;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
  }
  .action-buttons button{
    flex:1;
    background:rgba(30,40,58,0.7);
    backdrop-filter:blur(20px);
    border:1px solid rgba(155,77,255,0.4);
    padding:10px;
    border-radius:40px;
    color:#fff;
    cursor:pointer;
    transition:all 0.2s;
  }
  .action-buttons button:hover{
    border-color:#40E0D0;
    transform:translateY(-2px);
  }
  .ai-loading{
    text-align:center;
    padding:14px;
    background:rgba(155,77,255,0.15);
    backdrop-filter:blur(20px);
    border-radius:40px;
    margin:16px 0;
    color:#40E0D0;
    display:none;
  }
  .victory-message{
    background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(34,197,94,0.04));
    border:0.5px solid #22c55e;
    border-radius:24px;
    padding:16px;
    text-align:center;
    margin-bottom:20px;
    display:none;
  }
  .status{
    position:fixed;
    bottom:20px;
    right:20px;
    background:rgba(64,224,208,0.95);
    backdrop-filter:blur(10px);
    padding:8px 16px;
    border-radius:40px;
    color:#000;
    font-size:12px;
    font-weight:500;
    z-index:1000;
  }
  footer{
    margin-top:40px;
    text-align:center;
    font-size:11px;
    color:#6a7a9a;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
  }
  footer a{color:#b07cff;text-decoration:none}
  
  .lang-select{
    background:rgba(20,28,40,0.7);
    backdrop-filter:blur(20px);
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid rgba(155,77,255,0.3);
    cursor:pointer;
    font-size:12px;
  }
  
  @media(max-width:600px){
    .hero-btn{font-size:16px;padding:14px}
    .mode-btn{font-size:13px}
    .glitch-logo{font-size:20px;top:15px;left:15px}
  }
</style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>
<div class="edge-glow"></div>
<div class="glitch-logo">⚡ iField AI</div>

<div class="container">
  <div style="text-align:right;margin-bottom:10px;">
    <select id="langSelect" class="lang-select">
      <option value="en">🌍 English</option>
      <option value="ua">🇺🇦 Українська</option>

  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="auto">🚀 AUTO</button>

    <div class="field"><label id="nicheLabel">🎯 Niche</label><input id="niche" placeholder="beauty, coffee, fitness..." value="beauty"></div>

    <div class="field"><label id="platformLabel">📱 Platform</label>
      <select id="platform">
        <option value="ig">📸 Instagram Bio</option>
        <option value="tt">🎵 TikTok Landing</option>
        <option value="tg">💬 Telegram Funnel</option>
      </select>
    </div>
    <div class="additional-toggle" onclick="toggleAdditional()" id="additionalToggle">▼ Additional options ▼</div>
    <div id="additionalOptions" class="additional-options">
      <div class="field"><label id="descLabel">📝 Description</label><textarea id="description" rows="2">Luxury skincare that transforms your skin in 7 days.</textarea></div>
      <div class="field"><label id="imageLabel">🖼️ Image URL</label><input id="imageUrl" placeholder="https://..."></div>
      <div class="field"><label id="contactLabel">📡 Contacts</label><input id="contact" placeholder="@lumiskin"></div>
    </div>
    <button class="hero-btn" id="manualGenBtn">🚀 Create Landing</button>
  </div>

  <div class="limits">
    <span>🎁 <span class="limit-free" id="limitCount">3</span> <span id="freeText">free left</span></span>
    <span>💎 <span id="proText">PRO: unlimited + AI improve</span></span>

  <div id="aiLoading" class="ai-loading">🤖 AI thinking...</div>

  <div class="result-section" id="resultSection">
    <div id="victoryMessage" class="victory-message"><div>🎉</div><div><strong id="victoryTitle">Site is ready!</strong></div></div>
    <iframe class="preview-frame" id="previewFrame"></iframe>
    <div class="action-buttons">
      <button id="btnDownload">📥 Download</button>
      <button id="btnCopy">📋 Copy code</button>
      <button id="btnImprove" class="improve-btn">🧠 AI Improve (+32%)</button>
      <button id="btnShare">🔥 Share & Earn</button>
      <button id="btnPublish">🌐 Publish</button>
    </div>
  </div>

  <footer><a href="#">💬 Telegram</a><a href="#">📸 Instagram</a><a href="#">🐙 GitHub</a></footer>
</div>

<script>
// ====================== PREMIUM 3D COSMOS ======================
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Звёздные слои для глубины
const starLayers = [
  { count: 800, size: [0.8, 1.5], speed: 0.1, alpha: [0.3, 0.7], color: '#ffffff' },
  { count: 400, size: [1.5, 2.5], speed: 0.2, alpha: [0.5, 0.9], color: '#aaccff' },
  { count: 150, size: [2, 4], speed: 0.05, alpha: [0.6, 1], color: '#ffddaa' }
];

let stars = [];
starLayers.forEach((layer, layerIdx) => {
  for (let i = 0; i < layer.count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
      alpha: layer.alpha[0] + Math.random() * (layer.alpha[1] - layer.alpha[0]),
      speed: layer.speed + Math.random() * 0.1,
      twinkleSpeed: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      color: layer.color,
      layer: layerIdx
    });
  }
});

// Кометы
const comets = [];
for (let i = 0; i < 5; i++) {
  comets.push({
    x: Math.random() * width,
    y: Math.random() * height,
    vx: (Math.random() - 0.5) * 1.5,
    vy: (Math.random() - 0.5) * 1,
    length: 40 + Math.random() * 60,
    alpha: 0.3 + Math.random() * 0.5,
    active: Math.random() > 0.7
  });
}

// Туманности (большие цветные пятна)
const nebulae = [
  { x: 0.2, y: 0.3, radius: 250, color: 'rgba(100,50,150,0.08)' },
  { x: 0.7, y: 0.6, radius: 300, color: 'rgba(50,100,150,0.06)' },
  { x: 0.5, y: 0.8, radius: 200, color: 'rgba(150,50,100,0.05)' },
  { x: 0.1, y: 0.7, radius: 180, color: 'rgba(64,224,208,0.04)' }
];

// Спутники с орбитами
const satellites = [];
for (let i = 0; i < 12; i++) {
  satellites.push({
    x: Math.random() * width,
    y: Math.random() * height,
    radius: 3 + Math.random() * 4,
    orbitX: Math.random() * width,
    orbitY: Math.random() * height,
    orbitRadius: 60 + Math.random() * 100,
    angle: Math.random() * Math.PI * 2,
    speed: 0.002 + Math.random() * 0.005,
    color: `hsla(${160 + Math.random() * 60}, 80%, 65%, 0.7)`
  });
}

let time = 0;
let mouseX = width/2, mouseY = height/2;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function drawSpace() {
  if (!ctx) return;
  
  // Чистый глубокий фон
  const grad = ctx.createLinearGradient(0, 0, width, height);
  grad.addColorStop(0, '#020210');
  grad.addColorStop(0.5, '#040418');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);
  
  // Туманности
  nebulae.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x * width, n.y * height, n.radius, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();
  });
  
  // Параллакс-звёзды (двигаются с мышью)
  const parallaxX = (mouseX - width/2) * 0.0005;
  const parallaxY = (mouseY - height/2) * 0.0005;
  
  // Звёзды с мерцанием и параллаксом
  stars.forEach(star => {
    const twinkle = star.alpha + Math.sin(time * star.twinkleSpeed + star.phase) * 0.2;
    const px = star.x + parallaxX * (star.layer + 1) * 10;
    const py = star.y + parallaxY * (star.layer + 1) * 10;
    
    ctx.beginPath();
    ctx.arc(px, py, star.radius, 0, Math.PI * 2);
    ctx.fillStyle = star.color;
    ctx.globalAlpha = Math.max(0.2, Math.min(0.9, twinkle));
    ctx.fill();
    
    // Glow для крупных звёзд
    if (star.radius > 2) {
      ctx.beginPath();
      ctx.arc(px, py, star.radius * 2, 0, Math.PI * 2);
      ctx.fillStyle = star.color;
      ctx.globalAlpha = twinkle * 0.15;
      ctx.fill();
    }
  });
  
  // Кометы
  comets.forEach(comet => {
    if (comet.active && Math.random() > 0.99) {
      comet.x = Math.random() * width;
      comet.y = Math.random() * height;
      comet.vx = (Math.random() - 0.5) * 2;
      comet.vy = (Math.random() - 0.5) * 1.5;
      comet.active = true;
    }
    
    if (comet.active) {
      comet.x += comet.vx;
      comet.y += comet.vy;
      
      if (comet.x < -100 || comet.x > width + 100 || comet.y < -100 || comet.y > height + 100) {
        comet.active = false;
        setTimeout(() => { comet.active = true; }, 2000 + Math.random() * 5000);
      }
      
      // Хвост кометы
      ctx.beginPath();
      ctx.moveTo(comet.x, comet.y);
      ctx.lineTo(comet.x - comet.vx * comet.length, comet.y - comet.vy * comet.length);
      ctx.lineWidth = 2;
      ctx.strokeStyle = `rgba(255,200,100,${comet.alpha * 0.6})`;
      ctx.stroke();
      
      // Ядро
      ctx.beginPath();
      ctx.arc(comet.x, comet.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,150,${comet.alpha})`;
      ctx.fill();
    }
  });
  
  // Спутники
  satellites.forEach(sat => {
    const angle = time * sat.speed + sat.angle;
    const x = sat.orbitX + Math.cos(angle) * sat.orbitRadius;
    const y = sat.orbitY + Math.sin(angle) * sat.orbitRadius * 0.7;
    
    // Свечение
    ctx.beginPath();
    ctx.arc(x, y, sat.radius * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = sat.color;
    ctx.globalAlpha = 0.3;
    ctx.fill();
    
    // Тело
    ctx.beginPath();
    ctx.arc(x, y, sat.radius, 0, Math.PI * 2);
    ctx.fillStyle = sat.color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    
    // Солнечные панели (маленькие крылья)
    ctx.beginPath();
    ctx.moveTo(x - sat.radius * 1.5, y - sat.radius * 0.5);
    ctx.lineTo(x - sat.radius * 3, y);
    ctx.lineTo(x - sat.radius * 1.5, y + sat.radius * 0.5);
    ctx.fillStyle = `rgba(100,200,255,0.6)`;
    ctx.fill();
    
    ctx.beginPath();
    ctx.moveTo(x + sat.radius * 1.5, y - sat.radius * 0.5);
    ctx.lineTo(x + sat.radius * 3, y);
    ctx.lineTo(x + sat.radius * 1.5, y + sat.radius * 0.5);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
  
  // Млечный путь (полупрозрачная полоса)
  const milkyWay = ctx.createLinearGradient(width * 0.2, height * 0.3, width * 0.8, height * 0.7);
  milkyWay.addColorStop(0, 'rgba(100,80,150,0.03)');
  milkyWay.addColorStop(0.5, 'rgba(150,120,200,0.06)');
  milkyWay.addColorStop(1, 'rgba(80,60,120,0.02)');
  ctx.fillStyle = milkyWay;
  ctx.fillRect(0, 0, width, height);
  
  time += 0.02;
  requestAnimationFrame(drawSpace);
}

drawSpace();

// ====================== AI CORE ======================
const translations = {
  en: { generate: "✨ Generate Site Instantly ✨", ideaLabel: "🧠 Describe your idea", brandLabel: "🏷️ Brand / Company", nicheLabel: "🎯 Niche", productLabel: "✨ Main product", platformLabel: "📱 Platform", descLabel: "📝 Description", imageLabel: "🖼️ Image URL", contactLabel: "📡 Contacts", additionalToggle: "▼ Additional options ▼", freeText: "free left", proText: "PRO: unlimited + AI improve", victoryTitle: "Site is ready! Share & get +3 free", improveBtn: "🧠 AI Improve (+32%)", shareBtn: "🔥 Share & Earn", publishBtn: "🌐 Publish" },
  ua: { generate: "✨ Створити сайт ✨", ideaLabel: "🧠 Опишіть ідею", brandLabel: "🏷️ Бренд / Компанія", nicheLabel: "🎯 Ніша", productLabel: "✨ Головний продукт", platformLabel: "📱 Платформа", descLabel: "📝 Опис", imageLabel: "🖼️ URL фото", contactLabel: "📡 Контакти", additionalToggle: "▼ Додаткові опції ▼", freeText: "безкоштовно", proText: "PRO: безліміт + AI", victoryTitle: "Сайт готовий! Поділіться", improveBtn: "🧠 AI Покращення (+32%)", shareBtn: "🔥 Поділитися", publishBtn: "🌐 Опублікувати" },
  ru: { generate: "✨ Создать сайт ✨", ideaLabel: "🧠 Опишите идею", brandLabel: "🏷️ Бренд / Компания", nicheLabel: "🎯 Ниша", productLabel: "✨ Главный продукт", platformLabel: "📱 Платформа", descLabel: "📝 Описание", imageLabel: "🖼️ URL фото", contactLabel: "📡 Контакты", additionalToggle: "▼ Дополнительные опции ▼", freeText: "бесплатно", proText: "PRO: безлимит + AI", victoryTitle: "Сайт готов! Поделитесь", improveBtn: "🧠 AI Улучшение (+32%)", shareBtn: "🔥 Поделиться", publishBtn: "🌐 Опубликовать" }
};

let currentLang = localStorage.getItem('lang') || 'en';
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  const t = translations[lang];
  document.getElementById('autoGenBtn').innerText = t.generate;
  document.getElementById('ideaLabel').innerText = t.ideaLabel;
  document.getElementById('brandLabel').innerText = t.brandLabel;
  document.getElementById('nicheLabel').innerText = t.nicheLabel;
  document.getElementById('productLabel').innerText = t.productLabel;
  document.getElementById('platformLabel').innerText = t.platformLabel;
  document.getElementById('descLabel').innerText = t.descLabel;
  document.getElementById('imageLabel').innerText = t.imageLabel;
  document.getElementById('contactLabel').innerText = t.contactLabel;
  document.getElementById('additionalToggle').innerText = t.additionalToggle;
  document.getElementById('freeText').innerText = t.freeText;
  document.getElementById('proText').innerText = t.proText;
  document.getElementById('victoryTitle').innerText = t.victoryTitle;
  document.getElementById('btnImprove').innerHTML = t.improveBtn;
  document.getElementById('btnShare').innerHTML = t.shareBtn;
  document.getElementById('btnPublish').innerHTML = t.publishBtn;
}
document.getElementById('langSelect').addEventListener('change', (e) => setLanguage(e.target.value));
setLanguage(currentLang);

function detectNiche(text) {
  const t = text.toLowerCase();
  if (t.includes('coffee')) return 'coffee';
  if (t.includes('beauty') || t.includes('skin')) return 'beauty';
  if (t.includes('fitness')) return 'fitness';
  if (t.includes('crypto')) return 'crypto';
  if (t.includes('tech') || t.includes('ai')) return 'tech';
  return 'universal';
}

function getDesign(niche) {
  const designs = {
    coffee: { bg: '#2a1a0a', accent: '#c8a96e', gradient: 'linear-gradient(135deg,#FFD700,#FFA500)' },
    beauty: { bg: '#1a0a1a', accent: '#ff77aa', gradient: 'linear-gradient(135deg,#ff77aa,#9b4dff)' },
    fitness: { bg: '#0a1a0a', accent: '#44ff44', gradient: 'linear-gradient(135deg,#44ff44,#00ccff)' },
    universal: { bg: '#0a0c1a', accent: '#2c6eff', gradient: 'linear-gradient(135deg,#40E0D0,#9b4dff)' }
  };
  return designs[niche] || designs.universal;
}

function generateSmartContent(niche, platform = 'ig') {
  const map = {
    coffee: { brand: "BrewCraft", product: "Specialty Coffee", desc: "Fresh roasted beans delivered to your door.", cta: "Order Now", pain: "Tired of stale coffee?", solution: "Fresh roasted weekly", proof: "2,000+ subscribers" },
    beauty: { brand: "Lumi Skin", product: "Crystal Glow Serum", desc: "Luxury skincare that transforms your skin.", cta: "Book Consultation", pain: "Struggling with dull skin?", solution: "Visible results in 7 days", proof: "98% saw improvement" },
    fitness: { brand: "IronCore", product: "30-Day Transformation", desc: "Get visible results in 30 days.", cta: "Start Journey", pain: "Not seeing progress?", solution: "Science-backed workouts", proof: "10,000+ transformations" },
    crypto: { brand: "ChainFlow", product: "Web3 Dashboard", desc: "Manage your crypto portfolio easily.", cta: "Join Waitlist", pain: "Losing money?", solution: "All-in-one management", proof: "$50M+ secured" },
    tech: { brand: "NeuroTech", product: "AI Suite", desc: "Automate your business with AI.", cta: "Get Demo", pain: "Repetitive tasks?", solution: "AI does the work", proof: "500+ startups" },
    universal: { brand: "YourBrand", product: "Smart Solution", desc: "We help you grow faster.", cta: "Get Started", pain: "Not reaching goals?", solution: "Streamlined system", proof: "1,500+ clients" }
  };
  let data = map[niche] || map.universal;
  if (platform === 'ig') data.cta = "📱 Follow on IG";
  if (platform === 'tt') data.cta = "🎵 Watch on TikTok";
  if (platform === 'tg') data.cta = "💬 Write to TG";
  return data;
}

let freeGenerations = localStorage.getItem('freeGenerations') ? parseInt(localStorage.getItem('freeGenerations')) : 3;
let isPro = localStorage.getItem('pro') === 'true';
let currentHTML = '';

function updateBadge() {
  document.getElementById('limitCount').innerText = freeGenerations;
}
updateBadge();

function showStatus(msg, isError = false) {
  const s = document.createElement('div');
  s.className = 'status';
  s.textContent = msg;
  s.style.background = isError ? '#ff4d4d' : '#40E0D0';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 3000);
}

function toggleAdditional() {
  document.getElementById('additionalOptions').classList.toggle('open');
}

function simulateAILoading(callback) {
  const loader = document.getElementById('aiLoading');
  loader.style.display = 'block';
  const steps = ["🔭 Scanning cosmos...", "🤖 AI analyzing niche...", "✨ Generating premium design...", "🚀 Building your landing..."];
  let i = 0;
  const interval = setInterval(() => {
    if (i < steps.length) loader.innerHTML = steps[i++];
    else { clearInterval(interval); loader.style.display = 'none'; callback(); }
  }, 600);
}

function buildLandingHTML(brand, niche, product, desc, cta, imageUrl, contact, pain, solution, proof, platform) {
  const design = getDesign(niche);
  const img = imageUrl || 'https://placehold.co/800x500/1a1f2a/7bb2ff?text=Product';
  const contactLink = contact?.startsWith('@') ? `https://t.me/${contact.slice(1)}` : (contact || '#');
  const watermark = isPro ? '' : '<div style="font-size:11px;opacity:0.5;text-align:center;margin-top:20px;">⚡ Built with iField AI</div>';
  
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${brand} | ${product}</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:${design.bg};font-family:-apple-system,system-ui;padding:20px}
.container{max-width:720px;margin:0 auto;background:rgba(0,0,0,0.65);backdrop-filter:blur(20px);border-radius:48px;padding:40px 28px;border:0.5px solid ${design.accent}}
h1{font-size:44px;background:${design.gradient};-webkit-background-clip:text;background-clip:text;color:transparent}
.pain{background:#ff444410;border-left:4px solid #ff4444;padding:16px;border-radius:20px;margin:24px 0}
.solution{background:#44ff4410;border-left:4px solid #44ff44;padding:16px;border-radius:20px}
.proof{background:#ffaa3310;border-left:4px solid #ffaa33;padding:12px;border-radius:20px;margin:20px 0}
.cta-btn{display:block;background:${design.gradient};text-align:center;padding:16px;border-radius:60px;color:#fff;text-decoration:none;font-weight:700;margin:24px 0}
.limited{color:#ffaa66;font-size:12px;text-align:center}
</style></head>
<body><div class="container"><div class="pain">😫 ${pain}</div><h1>${brand}</h1><div style="font-size:22px;margin:8px 0">${product}</div><div class="solution">✅ ${solution}</div><div class="description">${desc}</div><div class="proof">📊 ${proof}</div><a href="${contactLink}" class="cta-btn">${cta}</a><div class="limited">⚠️ Limited spots — only 5 left</div>${watermark}</div></body></html>`;
}

function generateLanding(brand, niche, product, desc, imageUrl, contact, platform) {
  if (freeGenerations <= 0 && !isPro) {
    alert("⚠️ No free tries! Get PRO.");
    return false;
  }
  const smart = generateSmartContent(niche, platform);
  currentHTML = buildLandingHTML(brand || smart.brand, niche, product || smart.product, desc || smart.desc, smart.cta, imageUrl, contact || '@ifield', smart.pain, smart.solution, smart.proof, platform);
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('previewFrame').srcdoc = currentHTML;
  document.getElementById('victoryMessage').style.display = 'block';
  if (!isPro) {
    freeGenerations--;
    localStorage.setItem('freeGenerations', freeGenerations);
    updateBadge();
  }
  showStatus(`✅ Site ready! ${freeGenerations} free left`);
  return true;
}

function improveLanding() {
  if (!currentHTML) return;
  if (!isPro) {
    if (confirm("⚠️ Your site may be losing clients.\n\nAI found weak points.\n\n🧠 Fix with AI Improve (PRO)?")) {
      window.open('https://t.me/ifield_studio_bot?start=pro', '_blank');
    }
    return;
  }
  document.getElementById('aiLoading').style.display = 'block';
  document.getElementById('aiLoading').innerHTML = "🧠 AI improving your page...";
  setTimeout(() => {
    let improved = currentHTML;
    improved = improved.replace(/<h1>(.*?)<\/h1>/, `<h1>🔥 ${RegExp.$1} — Premium Quality</h1>`);
    improved = improved.replace(/Limited/g, "⚠️ ONLY 3 SPOTS LEFT");
    improved = improved.replace(/Get Started/g, "🚀 Get Instant Access");
    currentHTML = improved;
    document.getElementById('previewFrame').srcdoc = currentHTML;
    document.getElementById('aiLoading').style.display = 'none';
    showStatus("✅ Improved! +32% conversion estimated");
  }, 1500);
}

function downloadLanding() {
  if (!currentHTML) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentHTML], {type: 'text/html'}));
  a.download = `landing-${Date.now()}.html`;
  a.click();
  showStatus("📥 Downloaded!");
}

async function copyHTML() {
  if (!currentHTML) return;
  await navigator.clipboard.writeText(currentHTML);
  showStatus("📋 Copied!");
}

function viralShare() {
  freeGenerations += 3;
  localStorage.setItem('freeGenerations', freeGenerations);
  updateBadge();
  showStatus("🔥 +3 free generations! Share your site.");
  if (navigator.share) navigator.share({ title: 'My AI Landing', url: window.location.href });
  else navigator.clipboard.writeText(window.location.href);
}

async function publishToGist() {
  if (!currentHTML) { alert("Generate first!"); return; }
  let token = localStorage.getItem('github_token');
  if (!token) {
    token = prompt("🔑 GitHub token (gist only):\nhttps://github.com/settings/tokens/new");
    if (!token) return;
    localStorage.setItem('github_token', token);
  }
  const brand = document.getElementById('brand')?.value || 'landing';
  const slug = brand.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Date.now();
  try {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: `Landing: ${brand}`, public: true, files: { [slug+'.html']: { content: currentHTML } } })
    });
    const data = await res.json();
    const rawUrl = `https://htmlpreview.github.io/?${data.files[slug+'.html'].raw_url}`;
    await navigator.clipboard.writeText(rawUrl);
    alert(`🚀 Your site is LIVE!\n\n${rawUrl}\n\nLink copied!`);
  } catch(e) { alert("Publish failed. Check token."); }
}

function buyPro() {
  window.open('https://t.me/ifield_studio_bot?start=pro', '_blank');
  alert("💰 After payment, refresh with ?pro=true");
}

if (window.location.search.includes('pro=true')) {
  localStorage.setItem('pro', 'true');
  isPro = true;
  showStatus("🔥 PRO activated!");
}

// Event listeners
document.getElementById('autoGenBtn').onclick = () => {
  const niches = ['coffee', 'beauty', 'fitness', 'tech'];
  const random = niches[Math.floor(Math.random() * niches.length)];
  const smart = generateSmartContent(random);
  simulateAILoading(() => generateLanding(smart.brand, random, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};
document.getElementById('ideaGenBtn').onclick = () => {
  const idea = document.getElementById('ideaInput').value.trim();
  if (!idea) { alert("Enter your idea!"); return; }
  const niche = detectNiche(idea);
  const smart = generateSmartContent(niche);
  simulateAILoading(() => generateLanding(smart.brand, niche, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};
document.getElementById('manualGenBtn').onclick = () => {
  const brand = document.getElementById('brand').value;
  const niche = document.getElementById('niche').value;
  const product = document.getElementById('product').value;
  const desc = document.getElementById('description').value;
  const imageUrl = document.getElementById('imageUrl').value;
  const contact = document.getElementById('contact').value;
  const platform = document.getElementById('platform').value;
  if (!brand || !product) { alert("Brand and product required!"); return; }
  simulateAILoading(() => generateLanding(brand, niche || 'universal', product, desc, imageUrl, contact, platform));
};
document.getElementById('btnDownload').onclick = downloadLanding;
document.getElementById('btnCopy').onclick = copyHTML;
document.getElementById('btnImprove').onclick = improveLanding;
document.getElementById('btnShare').onclick = viralShare;
document.getElementById('btnPublish').onclick = publishToGist;
document.getElementById('proBuyBtn').onclick = buyPro;

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mode-panel').forEach(p => p.style.display = 'none');
    document.getElementById(btn.dataset.mode + 'Panel').style.display = 'block';
  };
});
</script>
</body>
</html>
