<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>iField AI — Cosmic Landing Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%239b4dff'>⚡</text></svg>">
<style>
/* =================== RESET & COSMOS =================== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#03050c;color:#fff;overflow-x:hidden;min-height:100vh;padding:0 10px;}

/* ЖИВОЙ КОСМОС */
#spaceCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}
.edge-glow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;box-shadow:inset 0 0 80px rgba(64,224,208,0.2),inset 0 0 120px rgba(155,77,255,0.15);animation:edgePulse 8s ease-in-out infinite}
@keyframes edgePulse{0%,100%{opacity:0.5}50%{opacity:1}}
.rainbow-glow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.rainbow-glow::before{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,#ff0066,#ff6600,#ffcc00,#33ff33,#00ccff,#6600ff,#ff0066);filter:blur(70px);opacity:0.2;animation:rainbowSpin 20s linear infinite}
@keyframes rainbowSpin{0%{transform:rotate(0deg) scale(1.2);opacity:0.2}100%{transform:rotate(360deg) scale(1.3);opacity:0.4}}

/* КОНТЕЙНЕР */
.container{max-width:720px;margin:0 auto;position:relative;z-index:10;padding:20px}
.glitch-logo{position:fixed;top:20px;left:20px;font-size:24px;font-weight:700;background:linear-gradient(135deg,#40E0D0,#9b4dff);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;z-index:100}

/* ТАБЫ */
.mode-tabs{display:flex;gap:8px;margin:60px 0 20px;background:rgba(20,28,40,0.6);backdrop-filter:blur(12px);border-radius:60px;padding:6px}
.mode-btn{flex:1;text-align:center;padding:12px 0;border-radius:50px;background:transparent;border:none;color:#a0b0d0;font-weight:600;font-size:16px;cursor:pointer;transition:all 0.2s}
.mode-btn.active{background:linear-gradient(135deg,#40E0D0,#9b4dff);color:#fff;box-shadow:0 4px 12px rgba(64,224,208,0.3)}

/* ПОЛЯ */
.field{margin-bottom:20px}
.field input,.field textarea,.field select{width:100%;background:rgba(20,28,40,0.8);border:1px solid rgba(155,77,255,0.3);border-radius:20px;padding:14px 18px;color:#fff;font-size:15px}
.field input:focus,.field textarea:focus{outline:none;border-color:#40E0D0}
.field label{font-size:12px;color:#b07cff;margin-bottom:6px;display:block}

/* ПУЛЬСИРУЮЩИЕ КНОПКИ */
.hero-btn{width:100%;background:linear-gradient(135deg,#40E0D0,#9b4dff);border:none;border-radius:60px;padding:18px;font-size:20px;font-weight:600;color:#fff;cursor:pointer;margin:16px 0;box-shadow:0 0 20px rgba(64,224,208,0.4);transition:0.2s;position:relative;animation:pulseGlow 2s infinite}
.hero-btn:hover{transform:scale(1.02)}
@keyframes pulseGlow{0%{box-shadow:0 0 5px rgba(64,224,208,0.3)}50%{box-shadow:0 0 25px rgba(64,224,208,0.8)}100%{box-shadow:0 0 5px rgba(64,224,208,0.3)}}
.improve-btn{background:linear-gradient(135deg,#ffaa33,#ff6600);animation:pulseGlowOrange 2s infinite}
@keyframes pulseGlowOrange{0%{box-shadow:0 0 5px rgba(255,102,0,0.3)}50%{box-shadow:0 0 25px rgba(255,102,0,0.7)}100%{box-shadow:0 0 5px rgba(255,102,0,0.3)}}

.additional-toggle{text-align:center;margin:12px;color:#8a9ac0;cursor:pointer;font-size:13px}
.additional-options{display:none;margin-bottom:20px}
.additional-options.open{display:block}
.limits{background:rgba(0,0,0,0.35);border-radius:40px;padding:12px 16px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-size:12px;margin:20px 0}
.limit-free{color:#22c55e;font-weight:bold}
.pro-buy-btn{background:linear-gradient(135deg,#ffd700,#ffb347);color:#1a1a2e;border:none;padding:6px 16px;border-radius:40px;cursor:pointer;font-weight:bold}

/* РЕЗУЛЬТАТЫ */
.result-section{display:none;margin-top:32px}
.preview-frame{width:100%;height:500px;border:none;border-radius:28px;background:#05070c}
.action-buttons{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.action-buttons button{flex:1;background:rgba(30,40,58,0.7);border:1px solid rgba(155,77,255,0.4);padding:10px;border-radius:40px;color:#fff;cursor:pointer}
.ai-loading{text-align:center;padding:14px;background:rgba(155,77,255,0.1);border-radius:40px;margin:16px 0;color:#40E0D0;display:none}
.victory-message{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(34,197,94,0.04));border:0.5px solid #22c55e;border-radius:24px;padding:16px;text-align:center;margin-bottom:20px;display:none}
.next-step{margin-top:20px;padding:16px;background:rgba(155,77,255,0.08);border-radius:24px;text-align:center;display:none}
.status{position:fixed;bottom:20px;right:20px;background:#40E0D0;padding:8px 16px;border-radius:40px;color:#000;font-size:12px;z-index:1000}
footer{margin-top:40px;text-align:center;font-size:11px;color:#6a7a9a;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
footer a{color:#b07cff;text-decoration:none}

@media(max-width:600px){.hero-btn{font-size:18px}.mode-btn{font-size:14px}}
</style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>
<div class="rainbow-glow"></div>
<div class="edge-glow"></div>
<div class="glitch-logo">⚡ iField AI v3</div>

<div class="container" id="app">
  <!-- Language Switcher -->
  <div style="text-align:right;margin-bottom:10px;">

    <div id="nextStep" class="next-step">

</div>

<script>
// ====================== 1. ЖИВОЙ КОСМОС (Canvas 2D) ======================
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Звёзды
const stars = [];
for (let i = 0; i < 1200; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 2 + 0.5,
    alpha: Math.random() * 0.5 + 0.2,
    speed: Math.random() * 0.3 + 0.1,
    twinkle: Math.random() * Math.PI * 2
  });
}

// Спутники
const satellites = [];
for (let i = 0; i < 12; i++) {
  satellites.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 4 + 2,
    angle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.008 + 0.003,
    orbitRadius: Math.random() * 120 + 40,
    centerX: Math.random() * canvas.width,
    centerY: Math.random() * canvas.height,
    color: `hsl(${Math.random() * 60 + 160}, 70%, 60%)`
  });
}

let time = 0;
function drawSpace() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Градиент
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, '#03050c');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Звёзды
  stars.forEach(star => {
    const twinkle = star.alpha + Math.sin(time * star.speed + star.twinkle) * 0.25;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.15, Math.min(0.8, twinkle))})`;
    ctx.fill();
  });
  
  // Спутники
  satellites.forEach(sat => {
    const x = sat.centerX + Math.cos(time * sat.speed + sat.angle) * sat.orbitRadius;
    const y = sat.centerY + Math.sin(time * sat.speed + sat.angle) * sat.orbitRadius * 0.6;
    ctx.beginPath();
    ctx.arc(x, y, sat.radius, 0, Math.PI * 2);
    ctx.fillStyle = sat.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, sat.radius * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(64, 224, 208, 0.15)`;
    ctx.fill();
  });
  
  time += 0.02;
  requestAnimationFrame(drawSpace);
}
drawSpace();

// ====================== 2. MULTI-LANGUAGE ======================
const translations = {
  en: {
    generate: "✨ Generate Site Instantly ✨",
    ideaLabel: "🧠 Describe your idea (one line)",
    brandLabel: "🏷️ Brand / Company",
    nicheLabel: "🎯 Niche",
    productLabel: "✨ Main product",
    platformLabel: "📱 Platform",
    descLabel: "📝 Description",
    imageLabel: "🖼️ Image URL",
    contactLabel: "📡 Contacts",
    additionalToggle: "▼ Additional options ▼",
    freeText: "free generations left",
    proText: "PRO: unlimited + no watermark + AI improve",
    victoryTitle: "Site is ready! Share & get +3 free tries",
    improveBtn: "🧠 AI Improve (+32% conversion)",
    shareBtn: "🔥 Share & Earn",
    publishBtn: "🌐 Publish to Web"
  },
  ua: {
    generate: "✨ Створити сайт миттєво ✨",
    ideaLabel: "🧠 Опишіть ідею (один рядок)",
    brandLabel: "🏷️ Бренд / Компанія",
    nicheLabel: "🎯 Ніша",
    productLabel: "✨ Головний продукт",
    platformLabel: "📱 Платформа",
    descLabel: "📝 Опис",
    imageLabel: "🖼️ URL зображення",
    contactLabel: "📡 Контакти",
    additionalToggle: "▼ Додаткові опції ▼",
    freeText: "безкоштовних генерацій",
    proText: "PRO: безліміт + без водяного знаку + AI покращення",
    victoryTitle: "Сайт готовий! Поділіться та отримайте +3 спроби",
    improveBtn: "🧠 AI Покращення (+32% конверсії)",
    shareBtn: "🔥 Поділитися та отримати",
    publishBtn: "🌐 Опублікувати"
  },
  ru: {
    generate: "✨ Создать сайт мгновенно ✨",
    ideaLabel: "🧠 Опишите идею (одна строка)",
    brandLabel: "🏷️ Бренд / Компания",
    nicheLabel: "🎯 Ниша",
    productLabel: "✨ Главный продукт",
    platformLabel: "📱 Платформа",
    descLabel: "📝 Описание",
    imageLabel: "🖼️ URL изображения",
    contactLabel: "📡 Контакты",
    additionalToggle: "▼ Дополнительные опции ▼",
    freeText: "бесплатных генераций",
    proText: "PRO: безлимит + без водяного знака + AI улучшение",
    victoryTitle: "Сайт готов! Поделитесь и получите +3 попытки",
    improveBtn: "🧠 AI Улучшение (+32% конверсии)",
    shareBtn: "🔥 Поделиться и получить",
    publishBtn: "🌐 Опубликовать"
  }
};

let currentLang = localStorage.getItem('lang') || 'en';
function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  const t = translations[lang];
  document.getElementById('autoGenBtn').innerText = t.generate;
  document.getElementById('ideaLabel').innerText = t.ideaLabel;
  document.getElementById('brandLabel').innerText = t.brandLabel;
  document.getElementById('nicheLabel').innerText = t.nicheLabel;
  document.getElementById('productLabel').innerText = t.productLabel;
  document.getElementById('platformLabel').innerText = t.platformLabel;
  document.getElementById('descLabel').innerText = t.descLabel;
  document.getElementById('imageLabel').innerText = t.imageLabel;
  document.getElementById('contactLabel').innerText = t.contactLabel;
  document.getElementById('additionalToggle').innerText = t.additionalToggle;
  document.getElementById('freeText').innerText = t.freeText;
  document.getElementById('proText').innerText = t.proText;
  document.getElementById('victoryTitle').innerText = t.victoryTitle;
  document.getElementById('btnImprove').innerHTML = t.improveBtn;
  document.getElementById('btnShare').innerHTML = t.shareBtn;
  document.getElementById('btnPublish').innerHTML = t.publishBtn;
}
document.getElementById('langSelect').addEventListener('change', (e) => setLanguage(e.target.value));
setLanguage(currentLang);

// ====================== 3. AI CORE ======================
function detectNiche(text) {
  const t = text.toLowerCase();
  if (t.includes('coffee') || t.includes('brew')) return 'coffee';
  if (t.includes('beauty') || t.includes('skin')) return 'beauty';
  if (t.includes('fitness') || t.includes('gym')) return 'fitness';
  if (t.includes('crypto') || t.includes('web3')) return 'crypto';
  if (t.includes('ai') || t.includes('tech')) return 'tech';
  return 'universal';
}

function generateSmartContent(niche, platform = 'ig', salesMode = false) {
  const map = {
    coffee: { brand: "BrewCraft", product: "Specialty Coffee", desc: "Fresh roasted beans delivered to your door.", cta: "Order Now", pain: "Tired of stale coffee?", solution: "Fresh roasted weekly", proof: "2,000+ subscribers" },
    beauty: { brand: "Lumi Skin", product: "Crystal Glow Serum", desc: "Luxury skincare that transforms your skin.", cta: "Book Consultation", pain: "Struggling with dull skin?", solution: "Visible results in 7 days", proof: "98% saw improvement" },
    fitness: { brand: "IronCore", product: "30-Day Transformation", desc: "Get visible results in 30 days.", cta: "Start Journey", pain: "Not seeing progress?", solution: "Science-backed workouts", proof: "10,000+ transformations" },
    crypto: { brand: "ChainFlow", product: "Web3 Dashboard", desc: "Manage your crypto portfolio easily.", cta: "Join Waitlist", pain: "Losing money on complicated platforms?", solution: "All-in-one management", proof: "$50M+ secured" },
    tech: { brand: "NeuroTech", product: "AI Suite", desc: "Automate your business with AI.", cta: "Get Demo", pain: "Repetitive tasks killing productivity?", solution: "AI does the work", proof: "500+ startups" },
    universal: { brand: "YourBrand", product: "Smart Solution", desc: "We help you grow faster.", cta: "Get Started", pain: "Not reaching your goals?", solution: "Streamlined system", proof: "1,500+ clients" }
  };
  let data = map[niche] || map.universal;
  if (platform === 'ig') data.cta = "📱 Follow on IG";
  if (platform === 'tt') data.cta = "🎵 Watch on TikTok";
  if (platform === 'tg') data.cta = "💬 Write to TG";
  if (salesMode) { data.desc += " ⚡ 20% off today!"; data.cta = "🔥 BUY NOW"; }
  return data;
}

function getDesign(niche) {
  const designs = {
    coffee: { bg: '#2a1a0a', accent: '#c8a96e', gradient: 'linear-gradient(135deg,#FFD700,#FFA500)' },
    beauty: { bg: '#1a0a1a', accent: '#ff77aa', gradient: 'linear-gradient(135deg,#ff77aa,#9b4dff)' },
    fitness: { bg: '#0a1a0a', accent: '#44ff44', gradient: 'linear-gradient(135deg,#44ff44,#00ccff)' },
    universal: { bg: '#0a0c1a', accent: '#2c6eff', gradient: 'linear-gradient(135deg,#40E0D0,#9b4dff)' }
  };
  return designs[niche] || designs.universal;
}

// ====================== 4. STATE ======================
let freeGenerations = localStorage.getItem('freeGenerations') ? parseInt(localStorage.getItem('freeGenerations')) : 3;
let isPro = localStorage.getItem('pro') === 'true';
let currentHTML = '';
let currentNiche = 'universal';

function updateBadge() {
  document.getElementById('limitCount').innerText = freeGenerations;
  if (freeGenerations <= 0 && !isPro) {
    document.querySelectorAll('.hero-btn').forEach(btn => btn.disabled = true);
  }
}
updateBadge();

function showStatus(msg, isError = false) {
  const s = document.createElement('div');
  s.className = 'status';
  s.textContent = msg;
  s.style.background = isError ? '#ff4d4d' : '#40E0D0';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 3000);
}

function toggleAdditional() {
  document.getElementById('additionalOptions').classList.toggle('open');
}

function simulateAILoading(callback) {
  const loader = document.getElementById('aiLoading');
  loader.style.display = 'block';
  const steps = ["🤖 Analyzing niche...", "🧠 Generating sales copy...", "🎯 Optimizing for conversion...", "✨ Building your landing..."];
  let i = 0;
  const interval = setInterval(() => {
    if (i < steps.length) loader.innerHTML = steps[i++];
    else { clearInterval(interval); loader.style.display = 'none'; callback(); }
  }, 600);
}

// ====================== 5. BUILD HTML ======================
function buildLandingHTML(brand, niche, product, desc, cta, imageUrl, contact, pain, solution, proof, platform) {
  const design = getDesign(niche);
  const img = imageUrl || 'https://placehold.co/800x500/1a1f2a/7bb2ff?text=Product';
  const contactLink = contact?.startsWith('@') ? `https://t.me/${contact.slice(1)}` : (contact || '#');
  const watermark = isPro ? '' : '<div style="font-size:11px;opacity:0.5;text-align:center;margin-top:20px;">⚡ Built with iField AI</div>';
  
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${brand} | ${product}</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:${design.bg};font-family:-apple-system,system-ui;padding:20px}
.container{max-width:720px;margin:0 auto;background:rgba(0,0,0,0.65);backdrop-filter:blur(20px);border-radius:48px;padding:40px 28px;border:0.5px solid ${design.accent}}
h1{font-size:44px;background:${design.gradient};-webkit-background-clip:text;background-clip:text;color:transparent}
.pain{background:#ff444410;border-left:4px solid #ff4444;padding:16px;border-radius:20px;margin:24px 0}
.solution{background:#44ff4410;border-left:4px solid #44ff44;padding:16px;border-radius:20px}
.proof{background:#ffaa3310;border-left:4px solid #ffaa33;padding:12px;border-radius:20px;margin:20px 0}
.cta-btn{display:block;background:${design.gradient};text-align:center;padding:16px;border-radius:60px;color:#fff;text-decoration:none;font-weight:700;margin:24px 0}
.limited{color:#ffaa66;font-size:12px;text-align:center}
</style></head>
<body><div class="container"><div class="pain">😫 ${pain}</div><h1>${brand}</h1><div style="font-size:22px;margin:8px 0">${product}</div><div class="solution">✅ ${solution}</div><div class="description">${desc}</div><div class="proof">📊 ${proof}</div><a href="${contactLink}" class="cta-btn">${cta}</a><div class="limited">⚠️ Limited spots — only 5 left</div>${watermark}</div></body></html>`;
}

// ====================== 6. GENERATE ======================
function generateLanding(brand, niche, product, desc, imageUrl, contact, platform) {
  if (freeGenerations <= 0 && !isPro) {
    alert("⚠️ No free tries left! Get PRO for unlimited.");
    return false;
  }
  
  const salesMode = localStorage.getItem('salesMode') === 'on';
  const smart = generateSmartContent(niche, platform, salesMode);
  currentNiche = niche;
  
  currentHTML = buildLandingHTML(
    brand || smart.brand, niche, product || smart.product, desc || smart.desc,
    smart.cta, imageUrl, contact || '@ifield', smart.pain, smart.solution, smart.proof, platform
  );
  
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('previewFrame').srcdoc = currentHTML;
  document.getElementById('victoryMessage').style.display = 'block';
  
  if (!isPro) {
    freeGenerations--;
    localStorage.setItem('freeGenerations', freeGenerations);
    updateBadge();
  }
  
  showStatus(`✅ Site generated! ${freeGenerations} free left`);
  return true;
}

// ====================== 7. AI IMPROVE (продаёт PRO) ======================
function improveLanding() {
  if (!currentHTML) return;
  if (!isPro) {
    const upgrade = confirm("⚠️ Your site may be losing clients.\n\nAI found weak points:\n• weak headline\n• low urgency\n• weak CTA\n\n🧠 Fix it with AI Improve (PRO)\n\nUpgrade now?");
    if (upgrade) buyPro();
    return;
  }
  
  document.getElementById('aiLoading').style.display = 'block';
  document.getElementById('aiLoading').innerHTML = "🧠 AI rewriting your page...";
  setTimeout(() => {
    let improved = currentHTML;
    improved = improved.replace(/<h1>(.*?)<\/h1>/, `<h1>🔥 ${RegExp.$1} — Transform your results</h1>`);
    improved = improved.replace(/Limited/g, "⚠️ ONLY 3 SPOTS LEFT");
    improved = improved.replace(/Get Started/g, "🚀 Get Instant Access");
    improved = improved.replace(/Order Now/g, "🔥 BUY NOW");
    currentHTML = improved;
    document.getElementById('previewFrame').srcdoc = currentHTML;
    document.getElementById('aiLoading').style.display = 'none';
    showStatus("✅ Site improved! +32% conversion estimated");
  }, 1500);
}

// ====================== 8. ACTIONS ======================
function downloadLanding() {
  if (!currentHTML) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentHTML], {type: 'text/html'}));
  a.download = `landing-${Date.now()}.html`;
  a.click();
  showStatus("📥 Downloaded!");
}

async function copyHTML() {
  if (!currentHTML) return;
  await navigator.clipboard.writeText(currentHTML);
  showStatus("📋 Copied!");
}

function viralShare() {
  if (!currentHTML) { alert("Generate first!"); return; }
  freeGenerations += 3;
  localStorage.setItem('freeGenerations', freeGenerations);
  updateBadge();
  showStatus("🔥 +3 free generations! Share your site with clients.");
  if (navigator.share) {
    navigator.share({ title: 'My AI Landing', text: 'Check out my site!', url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Link copied! Share with friends.");
  }
}

async function publishToGist() {
  if (!currentHTML) { alert("Generate first!"); return; }
  let token = localStorage.getItem('github_token');
  if (!token) {
    token = prompt("🔑 GitHub token (gist only):\nhttps://github.com/settings/tokens/new");
    if (!token) return;
    localStorage.setItem('github_token', token);
  }
  const brand = document.getElementById('brand')?.value || 'landing';
  const slug = brand.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Date.now();
  try {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: `Landing: ${brand}`, public: true, files: { [slug+'.html']: { content: currentHTML } } })
    });
    const data = await res.json();
    const rawUrl = `https://htmlpreview.github.io/?${data.files[slug+'.html'].raw_url}`;
    await navigator.clipboard.writeText(rawUrl);
    alert(`🚀 Your site is LIVE!\n\n${rawUrl}\n\nLink copied!`);
  } catch(e) { alert("Publish failed. Check token."); }
}

function buyPro() {
  window.open('https://t.me/ifield_studio_bot?start=pro', '_blank');
  alert("💰 After payment, click the link from bot.\n\nThen refresh with ?pro=true");
}

// ====================== 9. INIT & EVENT LISTENERS ======================
document.getElementById('autoGenBtn').onclick = () => {
  const niches = ['coffee', 'beauty', 'fitness', 'crypto', 'tech'];
  const randomNiche = niches[Math.floor(Math.random() * niches.length)];
  const smart = generateSmartContent(randomNiche);
  simulateAILoading(() => generateLanding(smart.brand, randomNiche, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};

document.getElementById('ideaGenBtn').onclick = () => {
  const idea = document.getElementById('ideaInput').value.trim();
  if (!idea) { alert("Enter your idea!"); return; }
  const niche = detectNiche(idea);
  const smart = generateSmartContent(niche);
  simulateAILoading(() => generateLanding(smart.brand, niche, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};

document.getElementById('manualGenBtn').onclick = () => {
  const brand = document.getElementById('brand').value;
  const niche = document.getElementById('niche').value;
  const product = document.getElementById('product').value;
  const desc = document.getElementById('description').value;
  const imageUrl = document.getElementById('imageUrl').value;
  const contact = document.getElementById('contact').value;
  const platform = document.getElementById('platform').value;
  if (!brand || !product) { alert("Brand and product required!"); return; }
  simulateAILoading(() => generateLanding(brand, niche || 'universal', product, desc, imageUrl, contact, platform));
};

document.getElementById('btnDownload').onclick = downloadLanding;
document.getElementById('btnCopy').onclick = copyHTML;
document.getElementById('btnImprove').onclick = improveLanding;
document.getElementById('btnShare').onclick = viralShare;
document.getElementById('btnPublish').onclick = publishToGist;
document.getElementById('viralShareBtn').onclick = viralShare;
document.getElementById('proBuyBtn').onclick = buyPro;

// Mode switching
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mode-panel').forEach(p => p.style.display = 'none');
    document.getElementById(btn.dataset.mode + 'Panel').style.display = 'block';
  };
});

// Check PRO from URL
if (window.location.search.includes('pro=true')) {
  localStorage.setItem('pro', 'true');
  isPro = true;
  showStatus("🔥 PRO activated! Unlimited improvements.");
}

// Initial update
updateBadge();
</script>
</body>
</html>
