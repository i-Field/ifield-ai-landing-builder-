<style>

    z-index:0;

    border-radius:50%;

// ====================== ЖИВОЙ КОСМОС (движение + параллакс) ======================
function initStarfield() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 300; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 0.5;
    star.style.width = star.style.height = `${size}px`;
    star.style.top = `${Math.random() * 100}%`;
    star.style.left = `${Math.random() * 100}%`;
    star.style.animationDelay = `${Math.random() * 5}s`;
    star.style.animationDuration = `${3 + Math.random() * 4}s`;
    star.style.opacity = 0.3 + Math.random() * 0.5;
    container.appendChild(star);
  }
}

// Анимация движения звёзд (медленное плавание)
let starAnimationId = null;
function animateStars() {
  const stars = document.querySelectorAll('.star');
  stars.forEach((s, i) => {
    const dx = Math.sin(Date.now() * 0.0003 + i) * 0.03;
    const dy = Math.cos(Date.now() * 0.00025 + i * 0.7) * 0.03;
    let top = parseFloat(s.style.top);
    let left = parseFloat(s.style.left);
    top = (top + dy + 100) % 100;
    left = (left + dx + 100) % 100;
    s.style.top = top + '%';
    s.style.left = left + '%';
  });
  starAnimationId = requestAnimationFrame(animateStars);
}

// Параллакс при движении мыши / касания
function initParallax() {
  const starsContainer = document.getElementById('stars');
  let targetX = 0, targetY = 0;
  let currentX = 0, currentY = 0;
  
  function updateParallax() {
    currentX += (targetX - currentX) * 0.05;
    currentY += (targetY - currentY) * 0.05;
    starsContainer.style.transform = `translate(${currentX}px, ${currentY}px)`;
    requestAnimationFrame(updateParallax);
  }
  
  document.addEventListener('mousemove', (e) => {
    targetX = (e.clientX / window.innerWidth - 0.5) * 20;
    targetY = (e.clientY / window.innerHeight - 0.5) * 20;
  });
  
  // Для touch-устройств (iPhone)
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length) {
      targetX = (e.touches[0].clientX / window.innerWidth - 0.5) * 20;
      targetY = (e.touches[0].clientY / window.innerHeight - 0.5) * 20;
    }
  });
  
  updateParallax();
}

// Запуск космоса

function detectNiche(text) {
  const t = text.toLowerCase();
  if (t.includes('coffee')) return 'coffee';
  if (t.includes('beauty') || t.includes('skin')) return 'beauty';
  if (t.includes('fitness')) return 'fitness';
  if (t.includes('crypto')) return 'crypto';
  if (t.includes('tech') || t.includes('ai')) return 'tech';
  return 'universal';
}

function simulateAILoading(callback) {
  const loader = document.getElementById('aiLoading');

<body><div class="container"><div class="pain">😫 ${pain}</div><h1>${brand}</h1><div style="font-size:22px;margin:8px 0">${product}</div><div class="solution">✅ ${solution}</div><div class="description">${desc}</div><div class="proof">📊 ${proof}</div><a href="${contactLink}" class="cta-btn">${cta}</a><div class="limited">⚠️ Limited spots — only 5 left</div>${watermark}</div></body></html>`;
}

function generateLanding(brand, niche, product, desc, imageUrl, contact, platform) {
  if (freeGenerations <= 0 && !isPro) {
    alert("⚠️ No free tries left! Get PRO for unlimited.");
    return false;
  }
  const smart = generateSmartContent(niche, platform);
  currentHTML = buildLandingHTML(brand || smart.brand, niche, product || smart.product, desc || smart.desc, smart.cta, imageUrl, contact || '@ifield', smart.pain, smart.solution, smart.proof, platform);
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('previewFrame').srcdoc = currentHTML;
  document.getElementById('victoryMessage').style.display = 'block';
  if (!isPro) {
    freeGenerations--;
    localStorage.setItem('freeGenerations', freeGenerations);
    updateBadge();
  }
  showStatus(`✅ Site generated! ${freeGenerations} free left`);
  return true;
}

function improveLanding() {
  if (!currentHTML) return;
  if (!isPro) {
    const upgrade = confirm("⚠️ Your site may be losing clients.\n\nAI found weak points.\n\n🧠 Fix it with AI Improve (PRO)?");
    if (upgrade) buyPro();
    return;
  }
  document.getElementById('aiLoading').style.display = 'block';
  document.getElementById('aiLoading').innerHTML = "🧠 AI improving your page...";
  setTimeout(() => {
    let improved = currentHTML;
    improved = improved.replace(/<h1>(.*?)<\/h1>/, `<h1>🔥 ${RegExp.$1} — Premium Quality</h1>`);
    improved = improved.replace(/Limited/g, "⚠️ ONLY 3 SPOTS LEFT");
    improved = improved.replace(/Get Started/g, "🚀 Get Instant Access");
    currentHTML = improved;
    document.getElementById('previewFrame').srcdoc = currentHTML;
    document.getElementById('aiLoading').style.display = 'none';
    showStatus("✅ Improved! +32% conversion estimated");
  }, 1500);
}

function downloadLanding() {
  if (!currentHTML) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentHTML], {type: 'text/html'}));
  a.download = `landing-${Date.now()}.html`;
  a.click();
  showStatus("📥 Downloaded!");
}

async function copyHTML() {
  if (!currentHTML) return;
  await navigator.clipboard.writeText(currentHTML);
  showStatus("📋 Copied!");
}

function viralShare() {
  freeGenerations += 3;
  localStorage.setItem('freeGenerations', freeGenerations);
  updateBadge();
  showStatus("🔥 +3 free generations! Share your site with clients.");
  if (navigator.share) {
    navigator.share({ title: 'My AI Landing', text: 'Check out my site!', url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Link copied! Share with friends.");
  }
}

async function publishToGist() {
  if (!currentHTML) { alert("Generate first!"); return; }
  let token = localStorage.getItem('github_token');
  if (!token) {
    token = prompt("🔑 GitHub token (gist only):\nhttps://github.com/settings/tokens/new");
    if (!token) return;
    localStorage.setItem('github_token', token);
  }
  const brand = document.getElementById('brand')?.value || 'landing';
  const slug = brand.toLowerCase().replace(/[^a-z0-9]/g, '-') + '-' + Date.now();
  try {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: `Landing: ${brand}`, public: true, files: { [slug+'.html']: { content: currentHTML } } })
    });
    const data = await res.json();
    const rawUrl = `https://htmlpreview.github.io/?${data.files[slug+'.html'].raw_url}`;
    await navigator.clipboard.writeText(rawUrl);
    alert(`🚀 Your site is LIVE!\n\n${rawUrl}\n\nLink copied!`);
  } catch(e) { alert("Publish failed. Check token."); }
}

function buyPro() {
  window.open('https://t.me/ifield_studio_bot?start=pro', '_blank');
  alert("💰 After payment, click the link from the bot.\n\nThen refresh with ?pro=true");
}

// Check PRO from URL
if (window.location.search.includes('pro=true')) {
  localStorage.setItem('pro', 'true');
  isPro = true;
  showStatus("🔥 PRO activated! Unlimited improvements.");
}

// Event listeners
document.getElementById('autoGenBtn').onclick = () => {
  const niches = ['coffee', 'beauty', 'fitness', 'tech'];
  const random = niches[Math.floor(Math.random() * niches.length)];
  const smart = generateSmartContent(random);
  simulateAILoading(() => generateLanding(smart.brand, random, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};
document.getElementById('ideaGenBtn').onclick = () => {
  const idea = document.getElementById('ideaInput').value.trim();
  if (!idea) { alert("Enter your idea!"); return; }
  const niche = detectNiche(idea);
  const smart = generateSmartContent(niche);
  simulateAILoading(() => generateLanding(smart.brand, niche, smart.product, smart.desc, '', '@' + smart.brand, 'ig'));
};
document.getElementById('manualGenBtn').onclick = () => {
  const brand = document.getElementById('brand').value;
  const niche = document.getElementById('niche').value;
  const product = document.getElementById('product').value;
  const desc = document.getElementById('description').value;
  const imageUrl = document.getElementById('imageUrl').value;
  const contact = document.getElementById('contact').value;
  const platform = document.getElementById('platform').value;
  if (!brand || !product) { alert("Brand and product required!"); return; }
  simulateAILoading(() => generateLanding(brand, niche || 'universal', product, desc, imageUrl, contact, platform));
};
document.getElementById('btnDownload').onclick = downloadLanding;
document.getElementById('btnCopy').onclick = copyHTML;
document.getElementById('btnImprove').onclick = improveLanding;
document.getElementById('btnShare').onclick = viralShare;
document.getElementById('btnPublish').onclick = publishToGist;
document.getElementById('proBuyBtn').onclick = buyPro;

// Mode switching
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.mode-panel').forEach(p => p.style.display = 'none');
    document.getElementById(btn.dataset.mode + 'Panel').style.display = 'block';
  };
});

updateBadge();
</script>
