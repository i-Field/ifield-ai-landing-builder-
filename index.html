<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iField AI — Landing Builder v2.5</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,system-ui,sans-serif;overflow:hidden;background:#03050c;color:white}
  canvas#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
  .container{position:relative;z-index:2;max-width:720px;margin:20px auto;padding:20px;background:rgba(0,0,0,0.6);border-radius:28px;backdrop-filter:blur(12px)}
  h1{font-size:36px;text-align:center;margin-bottom:16px;color:#40E0D0}
  .field{margin-bottom:12px}
  .field label{font-size:13px;color:#b07cff;display:block;margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:20px;background:rgba(20,28,40,0.8);border:1px solid rgba(155,77,255,0.3);color:white;font-size:14px}
  .hero-btn{width:100%;padding:16px;border:none;border-radius:60px;font-size:18px;font-weight:600;color:white;cursor:pointer;background:linear-gradient(135deg,#40E0D0,#9b4dff);position:relative;overflow:hidden;transition:0.3s}
  .hero-btn::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;border:2px solid #fff;opacity:0;border-radius:60px;transition:0.3s}
  .hero-btn:hover::after{opacity:1;transform:scale(1.05)}
  .result-section{display:none;margin-top:20px}
  .preview-frame{width:100%;height:400px;border:none;border-radius:28px;background:#05070c;margin-top:12px}
  .action-buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .action-buttons button{flex:1;padding:10px;border-radius:40px;border:none;cursor:pointer;color:white;background:linear-gradient(135deg,#ffaa33,#ff6600);transition:0.3s}
  .action-buttons button:hover{transform:scale(1.05)}
  footer{text-align:center;font-size:12px;color:#6a7a9a;margin-top:24px}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="container">
  <h1>iField AI Landing Builder</h1>

  <div class="field">
    <label>Brand / Company</label>
    <input id="brand" value="LumiSkin">
  </div>
  <div class="field">
    <label>Niche</label>
    <input id="niche" value="beauty">
  </div>
  <div class="field">
    <label>Main Product</label>
    <input id="product" value="Crystal Glow Serum">
  </div>
  <div class="field">
    <label>Description</label>
    <textarea id="description" rows="2">Luxury skincare that transforms your skin in 7 days.</textarea>
  </div>
  <div class="field">
    <label>Platform</label>
    <select id="platform">
      <option value="ig">Instagram</option>
      <option value="tt">TikTok</option>
      <option value="tg">Telegram</option>
    </select>
  </div>

  <button class="hero-btn" id="generateBtn">✨ Generate Landing ✨</button>

  <div class="result-section" id="resultSection">
    <iframe class="preview-frame" id="previewFrame"></iframe>
    <div class="action-buttons">
      <button onclick="downloadLanding()">📥 Download</button>
      <button onclick="copyHTML()">📋 Copy code</button>
      <button onclick="improveLanding()">🧠 Improve +32% conversion</button>
    </div>
  </div>
</div>

<footer>⚡ iField AI — from idea to client page in seconds</footer>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js';

const canvas = document.getElementById('bgCanvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);

camera.position.z = 600;

// starfield
const starsGeometry = new THREE.BufferGeometry();
const starCount = 2000;
const positions = new Float32Array(starCount*3);
for(let i=0;i<starCount*3;i++){positions[i]=(Math.random()-0.5)*4000}
starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
const starMaterial = new THREE.PointsMaterial({color:0xffffff,size:1});
const starField = new THREE.Points(starsGeometry,starMaterial);
scene.add(starField);

// satellites (simplified cubes)
const satellites = [];
for(let i=0;i<30;i++){
  const geo = new THREE.BoxGeometry(8,4,4);
  const mat = new THREE.MeshStandardMaterial({color:0x44ffff});
  const sat = new THREE.Mesh(geo,mat);
  sat.position.set((Math.random()-0.5)*1200,(Math.random()-0.5)*800,(Math.random()-0.5)*1200);
  scene.add(sat);
  satellites.push(sat);
}

// light
const ambient = new THREE.AmbientLight(0xffffff,0.7);
scene.add(ambient);
const pointLight = new THREE.PointLight(0xffffff,0.8);
pointLight.position.set(200,300,500);
scene.add(pointLight);

// animation
function animate(){
  requestAnimationFrame(animate);
  starField.rotation.y+=0.0005;
  satellites.forEach((sat,i)=>{
    sat.rotation.x+=0.01;
    sat.rotation.y+=0.02;
    sat.position.x+=Math.sin(Date.now()*0.001+i)*0.1;
    sat.position.y+=Math.cos(Date.now()*0.001+i)*0.1;
  });
  renderer.render(scene,camera);
}
animate();

// ======================= LANDING BUILDER =======================
let currentHTML = '';

function generateLanding(){
  const brand = document.getElementById('brand').value;
  const niche = document.getElementById('niche').value;
  const product = document.getElementById('product').value;
  const desc = document.getElementById('description').value;
  const platform = document.getElementById('platform').value;

  const cta = platform==='ig'?"📱 Follow on Instagram":platform==='tt'?"🎵 Watch on TikTok":"💬 Write to Telegram";
  const pain = niche==="beauty"?"😫 Struggling with dull skin?":"😫 Not reaching your goals?";
  const solution = niche==="beauty"?"✅ Visible results in 7 days":"✅ Streamlined system for growth";
  const proof = niche==="beauty"?"📊 98% saw improvement":"📊 1,500+ clients";

  currentHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${brand} | ${product}</title><style>
  body{font-family:-apple-system,system-ui;padding:20px;background:#05070c;color:white}
  .container{max-width:720px;margin:0 auto;background:rgba(0,0,0,0.6);border-radius:28px;padding:40px 28px;backdrop-filter:blur(12px)}
  h1{font-size:44px;color:#40E0D0;text-align:center;margin-bottom:16px}
  .pain{background:#ff444410;border-left:4px solid #ff4444;padding:16px;border-radius:20px;margin:24px 0}
  .solution{background:#44ff4410;border-left:4px solid #44ff44;padding:16px;border-radius:20px}
  .proof{background:#ffaa3310;border-left:4px solid #ffaa33;padding:12px;border-radius:20px}
  .cta-btn{display:block;text-align:center;padding:16px;border-radius:60px;color:white;text-decoration:none;font-weight:700;margin:24px 0;background:linear-gradient(135deg,#40E0D0,#9b4dff)}
  </style></head><body>
  <div class="container">
  <div class="pain">${pain}</div>
  <h1>${brand}</h1>
  <div style="font-size:22px;margin:8px 0">${product}</div>
  <div class="solution">${solution}</div>
  <div class="description">${desc}</div>
  <div class="proof">${proof}</div>
  <a href="#" class="cta-btn">${cta}</a>
  </div>
  </body></html>`;

  document.getElementById('resultSection').style.display='block';
  document.getElementById('previewFrame').srcdoc=currentHTML;
}

function improveLanding(){
  if(!currentHTML)return;
  currentHTML = currentHTML.replace(/cta-btn/g,"cta-btn pulse").replace(/Follow on Instagram|Watch on TikTok|Write to Telegram/g,"🔥 BUY NOW — Limited");
  document.getElementById('previewFrame').srcdoc=currentHTML;
}

function downloadLanding(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([currentHTML],{type:'text/html'}));
  a.download=`landing-${Date.now()}.html`;
  a.click();
}

async function copyHTML(){
  await navigator.clipboard.writeText(currentHTML);
  alert("Copied!");
}

document.getElementById('generateBtn').addEventListener('click',generateLanding);
</script>

</body>
</html>
