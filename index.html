<section class="box" aria-labelledby="s-about"><h2 id="s-about">${e(T("about",slang))}</h2><p>${e(v("desc"))}</p>${feats?`<ul>${feats}</ul>`:""}</section>
${v("price")?`<section class="box" aria-labelledby="s-price"><h2 id="s-price">${e(T("pricing",slang))}</h2><div class="price">${e(v("price"))}</div><a class="btn" href="${e(main)}" target="_blank" rel="noopener">${e(T("book",slang))}</a></section>`:""}
<footer><div>${links}</div><div>${mark}${hosted?`<a href="https://t.me/ifield_lab?text=Report%20__SLUG__" target="_blank" rel="noopener">⚑ Report</a>`:""}</div></footer></main></body></html>`;
}

/* ===== ДОСТУП ===== */
const used = () => store.get("if_used",0);
const hostOn = () => store.get("if_host",0) > Date.now();
const isPro = () => store.get("if_pro",false) || hostOn();
function renderBadge(){ $("badge").textContent = isPro() ? T("pro") : T("free").replace("{n}", Math.max(0,FREE-used())); }
function gate(){ if(isPro()||used()<FREE) return true; openModal("pro"); return false; }
function spend(){ if(!isPro()) store.set("if_used",used()+1); renderBadge(); }
async function verify(c){
  if(CODES.map(x=>x.toUpperCase()).includes(c)){ store.set("if_pro",true); return true; }
  if(!API) return false;
  try{ const r=await fetch(API+"/verify?code="+encodeURIComponent(c)); const j=await r.json(); if(j.ok){ store.set("if_code",c); store.set("if_pro",!!j.pro); store.set("if_host",j.host||0); } else if(store.get("if_code","")===c){ store.set("if_pro",false); store.set("if_host",0); } return j.ok===true }catch(e){ return false }
}
async function unlock(){
  const c=$("code").value.trim().toUpperCase();
  if(c && await verify(c) && isPro()){ $("modal").classList.remove("on"); $("msg").textContent=""; renderBadge(); preview(); }
  else $("msg").textContent=T("bad");
}

/* ===== ДЕЙСТВИЯ ===== */
const slug = () => (val("brand").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"site")+"-"+cur;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("on"),2200); }
function dl(){ if(!gate()) return; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([site()],{type:"text/html"})); a.download=slug()+".html"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); spend(); }
async function cp(){ if(!gate()) return; try{ await navigator.clipboard.writeText(site()); spend(); toast(T("ok")); }catch(e){ toast(T("err")); } }
async function sh(){
  if(!gate()) return;
  const f=new File([site()],slug()+".html",{type:"text/html"});
  if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:val("brand")}); spend(); }catch(e){} } else dl();
}
let pt; function preview(){ clearTimeout(pt); pt=setTimeout(()=>{ $("frame").srcdoc=site(); },120); }
function save(){ const o={}; F.forEach(f=>o[f[0]]=$("f-"+f[0]).value); store.set("if_form",o); }

function openModal(k){
  const h=k==="host";
  $("mt").dataset.i=h?"hostt":"mt"; $("mtext").dataset.i=h?"hostp":"mp";
  $("mt").textContent=T($("mt").dataset.i); $("mtext").textContent=T($("mtext").dataset.i);
  $("mprice").textContent=(h?PRICES.host:PRICES.pro)+" ⭐"; $("pay").href=h?HOST_URL:PAY_URL;
  $("modal").classList.add("on"); $("code").focus();
}
async function publish(){
  if(!API){ toast(T("puberr")); return; }
  if(!hostOn()){ openModal("host"); return; }
  try{
    const r=await fetch(API+"/publish",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code:store.get("if_code",""),slug:store.get("if_slug",""),brand:val("brand"),html:site(true)})});
    const j=await r.json(); if(!j.ok) throw 0;
    store.set("if_slug",j.slug);
    const a=document.createElement("a"); a.href=j.url; a.textContent=j.url; a.target="_blank"; a.rel="noopener";
    $("pubinfo").textContent=T("pubok")+" "; $("pubinfo").append(a);
    try{ await navigator.clipboard.writeText(j.url); }catch(e){}
  }catch(e){ toast(T("puberr")); }
}
async function aiFill(){
  const q=$("aiq").value.trim(); if(!q) return;
  if(!API){ toast(T("aierr")); return; }
  $("aib").disabled=true;
  try{
    const r=await fetch(API+"/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({q,lang:slang,code:store.get("if_code","")})});
    const j=await r.json(); if(!j.ok) throw 0;
    const d=j.data, set=(id,v)=>{ if(v) $("f-"+id).value=String(v); };
    set("brand",d.brand); set("tag",d.tag); set("niche",d.niche); set("product",d.product); set("desc",d.desc); set("feats",(d.feats||[]).join("\n"));
    save(); preview();
  }catch(e){ toast(T("aierr")); }
  $("aib").disabled=false;
}
async function refresh(){ const c=store.get("if_code",""); if(c && API){ await verify(c); renderBadge(); preview(); } }

/* ===== ФОТО (сжатие до 900px) ===== */
function handlePhoto(file){
  if(!file) return;
  const im=new Image(), u=URL.createObjectURL(file);
  im.onload=()=>{ const s=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); photo=c.toDataURL("image/jpeg",.82); store.set("if_photo",photo); URL.revokeObjectURL(u); thumb(); preview(); };
  im.onerror=()=>{ URL.revokeObjectURL(u); toast("⚠️ JPG / PNG"); }; im.src=u;
}
function thumb(){ $("thumb").innerHTML = photo ? `<img src="${photo}" alt=""><button class="btn" id="rm" aria-label="Remove">×</button>` : ""; if(photo) $("rm").onclick=()=>{ photo=""; store.set("if_photo",""); thumb(); preview(); }; }

/* ===== ИНТЕРФЕЙС ===== */
function renderStyles(){
  const one=(dup)=>Object.entries(TH).map(([k,t])=>`<button class="st" data-k="${k}" aria-pressed="${k===cur}"${dup?' tabindex="-1" aria-hidden="true"':""}><span class="sw" style="background:${t.bg}"><i style="background:${t.ac}"></i><i style="background:${t.ac2}"></i></span>${t.n}</button>`).join("");
  $("styles").innerHTML=`<div class="track">${one(false)}${one(true)}</div>`;
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{ cur=b.dataset.k; store.set("if_style",cur); document.querySelectorAll(".st").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===cur)); preview(); });
}
function buildForm(){
  const saved=store.get("if_form",{});
  $("form").innerHTML = ["ident","more"].map(g=>(g==="more"?`<details class="glass"><summary data-i="more"></summary>`:`<section class="glass"><h2 data-i="ident"></h2>`)+`<div class="fs">`+F.filter(f=>(G[f[0]]?"ident":"more")===g).map(f=>`<div class="${f[2]==="t"||f[0]==="img"?"w":""}"><label for="f-${f[0]}" data-i="${f[0]==="feats"?"feats":f[0]==="img"?"img":f[0]}"></label>${f[2]==="t"?`<textarea id="f-${f[0]}"></textarea>`:`<input id="f-${f[0]}" autocomplete="off">`}</div>`).join("")+(g==="ident"?`<div class="w"><label for="slang">🌐</label><select id="slang" aria-label="Site language">${Object.keys(L).map(k=>`<option value="${k}"${k===slang?" selected":""}>${{en:"English",ru:"Русский",uk:"Українська",pl:"Polski",de:"Deutsch",fr:"Français"}[k]}</option>`).join("")}</select></div>`:"")+(g==="more"?`<div class="w"><button class="btn" id="up" data-i="upload"></button><input type="file" id="file" accept="image/*" hidden><div class="thumb" id="thumb"></div></div>`:"")+(g==="more"?`</div></details>`:`</div></section>`)).join("");
  F.forEach(f=>{ const el=$("f-"+f[0]); el.value = saved[f[0]] ?? f[1]; el.addEventListener("input",()=>{ save(); preview(); }); });
  $("slang").onchange=e=>{ slang=e.target.value; store.set("if_slang",slang); preview(); };
  $("up").onclick=()=>$("file").click(); $("file").onchange=e=>{ handlePhoto(e.target.files[0]); e.target.value=""; };
}
function applyLang(){
  document.documentElement.lang=lang; $("lang").value=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  renderBadge(); preview();
}
buildForm(); renderStyles(); photo=store.get("if_photo",""); thumb(); applyLang();
$("yr").textContent=new Date().getFullYear();
$("lang").onchange=e=>{ lang=e.target.value; store.set("if_lang",lang); applyLang(); };
$("dl").onclick=dl; $("cp").onclick=cp; $("sh").onclick=sh; $("act").onclick=unlock; $("close").onclick=()=>$("modal").classList.remove("on");
$("code").addEventListener("keydown",e=>{ if(e.key==="Enter") unlock(); });
$("dm").onclick=()=>$("fw").classList.add("m"); $("dd").onclick=()=>$("fw").classList.remove("m");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("modal").classList.remove("on"); });
function setFx(on){ document.documentElement.classList.toggle("nofx",!on); $("fx").setAttribute("aria-pressed",on); store.set("if_fx",on); }
setFx(store.get("if_fx",true)); $("fx").onclick=()=>setFx(document.documentElement.classList.contains("nofx"));
let PRICES={pro:500,host:300}; if(API){ fetch(API+"/prices").then(r=>r.json()).then(p=>{ if(p.pro&&p.host) PRICES=p; }).catch(()=>{}); }
$("aibox").hidden=!AI_ON; $("aib").onclick=aiFill; $("pb").onclick=publish; refresh();
if(API){ $("lt").href=API+"/terms"; $("lp").href=API+"/privacy"; } else { $("lt").hidden=true; $("lp").hidden=true; }
(function(){ const c=new URLSearchParams(location.search).get("code"); if(c){ $("code").value=c; history.replaceState(null,"",location.pathname); unlock().then(()=>{ if(isPro()) toast("✓ Pro"); }); } })();
</script>
</body>
</html>
