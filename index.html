<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>iField Studio — Landing Builder</title>
<meta name="description" content="Make a one-page website for your business in a minute: 20 studio designs, smart niche autofill, 6 languages, live link.">
<meta name="theme-color" content="#060810">
<meta property="og:type" content="website">
<meta property="og:title" content="iField Studio — Landing Builder">
<meta property="og:description" content="A one-page website for your business in a minute. 20 designs, smart niche autofill, 6 languages.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
:root{
  --bg:#060810;--tx:#eef1fa;--mut:#8a93ad;--gl:rgba(255,255,255,.055);
  --ln:rgba(255,255,255,.11);--a:#40e0d0;--b:#9b4dff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(60% 45% at 15% 0,rgba(155,77,255,.18),transparent),
             radial-gradient(50% 40% at 95% 30%,rgba(64,224,208,.13),transparent),
             var(--bg);
  background-repeat:no-repeat;
  color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
main{
  position:relative;z-index:1;overflow-x:clip;
  max-width:1140px;margin:0 auto;padding:18px 18px 72px;
}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.logo{
  display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;
  letter-spacing:-.02em;background:none;border:0;padding:0;color:inherit;
  cursor:pointer;min-height:44px;
}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{
  padding:6px 14px;border-radius:99px;background:rgba(110,150,255,.14);
  border:1px solid var(--ln);font-size:13px;font-weight:700;
  animation:gl 4.5s steps(1) infinite;animation-delay:-1.2s;
}
#badge{
  background:linear-gradient(135deg,#22c55e,#16a34a);border:0;color:#fff;
  font-weight:800;letter-spacing:.02em;
  animation:gl 4.5s steps(1) infinite;animation-delay:-2.4s;
}
.mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--a),var(--b));background-size:200% 200%;
  display:grid;place-items:center;color:#06101a;
  animation:glow 3.2s ease-in-out infinite;
}
.mark span{display:block;animation:fl 5s linear infinite}
.lt{
  color:var(--tx);font-size:24px;font-weight:800;letter-spacing:-.02em;
  animation:gl 4.5s steps(1) infinite;
}
@keyframes gl{
  0%,86%,100%{text-shadow:none;transform:none}
  87%{text-shadow:2px 0 #ff2bd6,-2px 0 #19f1ff;transform:skewX(-6deg) translateX(1px)}
  89%{text-shadow:-3px 0 #ff2bd6,3px 0 #19f1ff;transform:skewX(5deg)}
  91%{text-shadow:2px 1px #ff2bd6,-2px -1px #19f1ff;transform:none}
  93%{text-shadow:none}
}
@keyframes glow{
  0%,100%{box-shadow:0 0 10px rgba(64,224,208,.35);background-position:0 0}
  50%{box-shadow:0 0 24px rgba(155,77,255,.75);background-position:100% 100%}
}
@keyframes fl{
  0%,90%,100%{opacity:1;transform:none}
  92%{opacity:.35}94%{opacity:1;transform:scale(1.2) rotate(-6deg)}
  96%{opacity:.5}98%{opacity:1}
}
.nofx .mark,.nofx .mark span,.nofx .lt,.nofx .pill,.nofx #badge{animation:none}
@media(prefers-reduced-motion:reduce){.mark,.mark span,.lt,.pill,#badge{animation:none}}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip,select{
  background:var(--gl);border:1px solid var(--ln);color:var(--tx);
  border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;min-height:40px;
}
option{background:#11131f}
h1{
  font-size:clamp(34px,7vw,58px);line-height:1.04;letter-spacing:-.035em;
  margin:36px 0 12px;
  background:linear-gradient(180deg,#fff,#97a1c4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-wrap:balance;
}
.lead{color:var(--mut);font-size:clamp(16px,2.2vw,19px);max-width:590px;margin:0 0 26px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}
@media(min-width:920px){
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .sticky{position:sticky;top:16px}
}
.glass{
  background:var(--gl);border:1px solid var(--ln);border-radius:22px;padding:20px;
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);margin-bottom:16px;
}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sec-h h2{margin:0}
.cnt{font-size:12px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:0 0 14px;color:var(--a);letter-spacing:.01em}

/* Две плавные противоположные ленты: дизайны -> влево, ниши -> вправо (работает свайпом и на iPhone!) */
.ribbon{
  min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);
  padding:2px 0;
}
.ribbon::-webkit-scrollbar{display:none}
.track{display:flex;gap:10px;width:max-content}
.st{
  all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;
  border:1px solid var(--ln);border-radius:99px;padding:7px 16px 7px 7px;
  background:rgba(255,255,255,.045);font-size:14px;font-weight:600;
  white-space:nowrap;min-height:46px;transition:border-color .2s,box-shadow .2s,background .2s;
}
.st:hover{border-color:rgba(255,255,255,.28)}
.st[aria-pressed=true]{
  border-color:var(--a);background:rgba(64,224,208,.1);
  box-shadow:0 0 0 1px var(--a),0 0 22px rgba(64,224,208,.2);
}
.sw{
  width:32px;height:32px;flex:none;border-radius:50%;
  display:flex;align-items:flex-end;gap:2px;padding:7px 6px;
}
.sw i{height:6px;border-radius:3px;flex:1}

.ribbon-gap{margin-top:14px;padding-top:12px;border-top:1px solid var(--ln)}
.ps{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  min-height:48px;padding:8px 18px;border-radius:99px;
  border:1px solid var(--ln);background:rgba(255,255,255,.05);
  font-size:15px;font-weight:600;color:var(--tx);white-space:nowrap;
  transition:border-color .15s,background .15s,transform .15s;
}
.ps:hover{border-color:var(--a);background:rgba(64,224,208,.1);transform:translateY(-1px)}
.ps[aria-pressed=true]{
  border-color:var(--a);background:linear-gradient(135deg,rgba(64,224,208,.2),rgba(155,77,255,.2));
  box-shadow:0 0 0 1px var(--a);color:#fff;
}

.tune{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--ln);
}
.tune-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seg{
  all:unset;cursor:pointer;min-height:36px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--ln);background:rgba(255,255,255,.035);
  font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s;
}
.seg[aria-pressed=true]{border-color:var(--a);color:var(--tx);background:rgba(64,224,208,.12)}
.color-pick{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);
  font-weight:600;cursor:pointer;
}
.color-pick input[type=color]{
  width:32px;height:32px;padding:2px;border-radius:50%;border:1px solid var(--ln);
  background:transparent;cursor:pointer;
}

:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.w{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
input,textarea{
  width:100%;background:rgba(255,255,255,.045);border:1px solid var(--ln);
  border-radius:12px;padding:11px 13px;color:var(--tx);font:inherit;font-size:16px;
}
textarea{min-height:76px;resize:vertical}
.niche-row{display:flex;gap:8px;align-items:stretch}
.niche-row input{flex:1;min-width:0}
.btn{
  all:unset;cursor:pointer;box-sizing:border-box;text-align:center;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  padding:11px 16px;border-radius:99px;font-weight:600;font-size:14px;
  background:var(--gl);border:1px solid var(--ln);white-space:nowrap;
  transition:transform .15s,opacity .15s,border-color .15s;
}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:rgba(255,255,255,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:linear-gradient(135deg,var(--a),var(--b));color:#06101a;border:0}
.btn.sm{min-height:44px;padding:0 14px;font-size:13px;border-radius:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.acts .btn{flex:1;min-width:110px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.fw{background:#000;border:1px solid var(--ln);border-radius:16px;overflow:hidden;margin:auto;transition:max-width .3s;max-width:100%}
.fw.m{max-width:390px}
iframe{width:100%;height:540px;border:0;display:block;background:#fff}
.pv-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:10px;font-variant-numeric:tabular-nums}
details.glass summary{
  cursor:pointer;list-style:none;font-weight:600;color:var(--a);
  display:flex;justify-content:space-between;align-items:center;min-height:36px;
}
details.glass summary::-webkit-details-marker{display:none}
details.glass summary::after{content:"▼";font-size:12px;transition:transform .2s}
details.glass[open] summary::after{transform:rotate(180deg)}
details.glass[open] summary{margin-bottom:14px}
.thumb{display:flex;align-items:center;gap:10px;margin-top:10px}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(8px);
  display:none;place-items:center;padding:20px;z-index:9;
}
.modal.on{display:grid}
.modal .glass{background:#10121d;max-width:420px;width:100%;text-align:center;margin:0}
.modal h2{color:var(--tx);font-size:20px}
.price{font-size:44px;font-weight:700;letter-spacing:-.03em;margin:6px 0}
.small{font-size:13px;color:var(--mut)}
#msg{min-height:20px;color:#ff9a9a;font-size:13px;margin:8px 0}
.steps{display:grid;gap:9px;text-align:left;margin:14px 0 18px}
.step{background:rgba(255,255,255,.045);border:1px solid var(--ln);border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.45;color:var(--tx)}
.fullpv{
  position:fixed;inset:0;z-index:11;background:#070911;display:none;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));
}
.fullpv.on{display:flex}
.fullpv-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px}
.fullpv-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
.fullpv-wrap iframe{height:100%;width:100%;border-radius:14px;border:1px solid var(--ln);transition:max-width .25s}
.fullpv-wrap.m iframe{max-width:390px}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);background:#fff;color:#000;padding:9px 18px;
  border-radius:99px;font-size:14px;font-weight:600;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:12;
}
.toast.on{opacity:1}
footer{text-align:center;margin-top:34px;font-size:13px;color:var(--mut)}
footer a{color:var(--mut);margin:0 8px}

.space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.space::before{
  content:"";position:absolute;inset:0;opacity:.7;background-size:420px 420px;
  animation:tw 7s ease-in-out infinite alternate;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),
                   radial-gradient(1px 1px at 38% 62%,#cfe,transparent),
                   radial-gradient(1.5px 1.5px at 66% 28%,#fff,transparent),
                   radial-gradient(1px 1px at 84% 74%,#fff,transparent),
                   radial-gradient(1px 1px at 52% 90%,#bfe,transparent),
                   radial-gradient(1.5px 1.5px at 92% 12%,#fff,transparent),
                   radial-gradient(1px 1px at 24% 82%,#fff,transparent);
}
@keyframes tw{to{opacity:.25}}
.space::after{
  content:"";position:absolute;inset:0;opacity:.5;background-size:300px 300px;
  animation:tw 5s ease-in-out infinite alternate-reverse;
  background-image:radial-gradient(1px 1px at 8% 14%,#fff,transparent),
                   radial-gradient(2px 2px at 22% 48%,#bff,transparent),
                   radial-gradient(1px 1px at 41% 8%,#fff,transparent),
                   radial-gradient(1.5px 1.5px at 57% 70%,#fff,transparent),
                   radial-gradient(1px 1px at 73% 38%,#cfe,transparent),
                   radial-gradient(2px 2px at 88% 86%,#fff,transparent),
                   radial-gradient(1px 1px at 95% 52%,#fff,transparent),
                   radial-gradient(1px 1px at 33% 92%,#fff,transparent);
}
.shoot{
  position:absolute;top:12%;left:-10%;width:100px;height:2px;
  background:linear-gradient(to left,#fff,transparent);opacity:0;
  animation:shoot 11s linear infinite;
}
@keyframes shoot{
  0%{transform:translate3d(0,0,0) rotate(25deg);opacity:0}
  3%{opacity:1}
  10%{transform:translate3d(120vw,56vh,0) rotate(25deg);opacity:0}
  100%{opacity:0}
}
.fly{
  position:absolute;left:0;font-size:30px;line-height:1;
  filter:drop-shadow(0 0 8px rgba(0,255,163,.55));
  animation:fly 30s linear infinite;will-change:transform;
}
.fly.l{animation-name:flyl}
@keyframes fly{from{transform:translate3d(-15vw,0,0);rotate:0deg}to{transform:translate3d(115vw,var(--dy,0),0);rotate:var(--spin,0deg)}}
.space .fly:nth-child(1),.space .fly:nth-child(4){--spin:1080deg}
@keyframes flyl{from{transform:translate3d(115vw,0,0)}to{transform:translate3d(-15vw,var(--dy,0),0)}}
.pl{position:absolute;right:-24px;top:16vh;font-size:110px;opacity:.28;animation:flt 14s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(30px) rotate(8deg)}}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.neon{
  position:fixed;inset:0;z-index:6;pointer-events:none;padding:3px;
  background:conic-gradient(from var(--ang),#ff7ac6,#ffb86b,#fff27a,#7dffc8,#6cc4ff,#a98bff,#ff7ac6);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:drop-shadow(0 0 8px rgba(167,139,250,.55)) drop-shadow(0 0 20px rgba(108,196,255,.35));
  animation:ang 9s linear infinite;
}
@keyframes ang{to{--ang:360deg}}
.nofx .space,.nofx .neon{display:none}
@media(prefers-reduced-motion:reduce){.space,.neon{display:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="space" aria-hidden="true">
  <span class="fly" style="top:10%;--dy:-6vh;animation-duration:34s">🛰️</span>
  <span class="fly" style="top:70%;--dy:-30vh;animation-duration:24s;animation-delay:-10s">🚀</span>
  <span class="fly l" style="top:40%;--dy:6vh;animation-duration:38s;animation-delay:-18s">🛸</span>
  <span class="fly" style="top:88%;--dy:-12vh;animation-duration:46s;animation-delay:-30s;font-size:22px">🛰️</span>
  <span class="pl">🪐</span><i class="shoot"></i><i class="shoot" style="top:46%;animation-delay:-5s"></i>
</div>
<div class="neon" aria-hidden="true"></div>

<main>
  <div class="top">
    <div class="brandrow">
      <button class="logo" id="fx" type="button" aria-pressed="true" aria-label="iField Studio: animation on/off">
        <span class="mark" aria-hidden="true"><span>⚡</span></span>
        <span class="lt">iField</span>
      </button>
      <span class="pill" data-i="lb"></span>
    </div>
    <div class="chips">
      <button class="chip" id="guidebtn" type="button" data-i="guideb" style="cursor:pointer"></button>
      <select id="lang" aria-label="Language">
        <option value="en">🇬🇧 EN</option>
        <option value="ru">🇷🇺 RU</option>
        <option value="uk">🇺🇦 UK</option>
        <option value="pl">🇵🇱 PL</option>
        <option value="de">🇩🇪 DE</option>
        <option value="fr">🇫🇷 FR</option>
      </select>
      <span class="chip" id="badge"></span>
    </div>
  </div>

  <h1 data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>

  <div class="grid">
    <div>
      <section class="glass">
        <div class="sec-h">
          <h2 data-i="style"></h2>
          <span class="cnt" id="stcnt"></span>
        </div>
        <div class="ribbon" id="styles" aria-label="Designs"></div>

        <div class="ribbon-gap">
          <div class="sec-h" style="margin-bottom:8px">
            <span class="cnt" data-i="niches"></span>
            <button class="seg" id="undo" type="button" hidden data-i="undo"></button>
          </div>
          <div class="ribbon" id="presets" aria-label="Niche presets"></div>
        </div>

        <div class="tune">
          <div class="tune-group" role="group" aria-label="Layout">
            <button class="seg" type="button" data-lay="" data-i="layauto"></button>
            <button class="seg" type="button" data-lay="card" data-i="laycard"></button>
            <button class="seg" type="button" data-lay="split" data-i="laysplit"></button>
            <button class="seg" type="button" data-lay="stack" data-i="laystack"></button>
          </div>
          <label class="color-pick">
            <span data-i="accent"></span>
            <input type="color" id="acpick" value="#40e0d0" aria-label="Accent color">
            <button class="seg" id="acrst" type="button" hidden>×</button>
          </label>
        </div>
      </section>

      <section class="glass" id="aibox" hidden>
        <label for="aiq" data-i="aiq"></label>
        <textarea id="aiq" rows="2" maxlength="400"></textarea>
        <button class="btn p" id="aib" data-i="aib" style="display:flex;width:100%;margin-top:10px"></button>
      </section>

      <div id="form"></div>
    </div>

    <section class="glass sticky">
      <div class="bar">
        <h2 data-i="preview" style="margin:0"></h2>
        <span style="display:flex;gap:6px">
          <button class="btn" id="dm" type="button" aria-label="Mobile">📱</button>
          <button class="btn" id="dd" type="button" aria-label="Desktop">🖥</button>
          <button class="btn" id="df" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
        </span>
      </div>
      <div class="fw m" id="fw"><iframe id="frame" title="Preview" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe></div>
      <div class="pv-meta"><span id="pvstat"></span><span id="pvsize"></span></div>
      <div class="acts">
        <button class="btn p" id="pb" type="button" data-i="publish"></button>
        <button class="btn" id="dl" type="button" data-i="dl"></button>
        <button class="btn" id="cp" type="button" data-i="copy"></button>
        <button class="btn" id="sh" type="button" data-i="share"></button>
      </div>
      <p class="small" id="pubinfo"></p>
    </section>
  </div>

  <footer>
    <a href="https://t.me/ifield_lab" target="_blank" rel="noopener">Telegram</a>
    <a href="https://fiverr.com/s/2KRdzKN" target="_blank" rel="noopener">Fiverr</a>
    <a href="https://i-field.github.io/ifield-studio" target="_blank" rel="noopener">Portfolio</a>
    <a id="lt" href="#" target="_blank" rel="noopener">Terms</a>
    <a id="lp" href="#" target="_blank" rel="noopener">Privacy</a>
    <br>© <span id="yr"></span> iField Studio
  </footer>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="glass">
    <h2 id="mt" data-i="mt"></h2>
    <div class="price" id="mprice">500 ⭐</div>
    <p class="small" id="mtext" data-i="mp"></p>

  let pausedUntil = 0;
  const pause = (ms) => { pausedUntil = Math.max(pausedUntil, Date.now() + ms); };

  el.addEventListener("touchstart", () => pause(3500), {passive:true});
  el.addEventListener("mouseenter", () => pause(60000), {passive:true});
  el.addEventListener("mouseleave", () => { pausedUntil = 0; }, {passive:true});
  el.addEventListener("focusin", () => pause(4000));
  if(speedPxPerSec < 0){
    requestAnimationFrame(() => { if(el.scrollWidth > el.clientWidth) el.scrollLeft = el.scrollWidth / 2; });
  }
  ribbons.push({ el, speed: speedPxPerSec, isPaused: () => Date.now() < pausedUntil });
}
let lastTs = 0;
function tickRibbons(ts){
  if(!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  const fxOff = document.documentElement.classList.contains("nofx") || window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(!fxOff){
    for(const r of ribbons){
      if(r.isPaused()) continue;
      const half = r.el.scrollWidth / 2;
      if(half <= r.el.clientWidth) continue;
      let next = r.el.scrollLeft + r.speed * dt;
      if(next >= half) next -= half;
      if(next <= 0) next += half;
      r.el.scrollLeft = next;
    }
  }
  requestAnimationFrame(tickRibbons);
}

function renderStyles(){
  const one=(dup)=>Object.entries(TH).map(([k,t])=>`<button type="button" class="st" data-k="${k}" aria-pressed="${k===cur}"${dup?' tabindex="-1" aria-hidden="true"':""}><span class="sw" style="background:${t.bg}"><i style="background:${t.ac}"></i><i style="background:${t.ac2}"></i></span>${t.n}</button>`).join("");
  $("styles").innerHTML=`<div class="track">${one(false)}${one(true)}</div>`;
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{
    if(!TH[b.dataset.k]) return;
    cur=b.dataset.k; store.set("if_style",cur);
    syncTuneUI(); preview();
  });
}

function renderPresets(){
  const box=$("presets"); box.textContent="";
  const track=document.createElement("div"); track.className="track";
  const ruLike=lang==="ru"||lang==="uk";
  [false,true].forEach(dup=>{
    PRESETS.forEach(p=>{
      const b=document.createElement("button"); b.type="button"; b.className="ps"; b.dataset.id=p.id;
      b.setAttribute("aria-pressed",p.id===curPreset);
      if(dup){ b.tabIndex=-1; b.setAttribute("aria-hidden","true"); }
      b.textContent=p.icon+" "+(ruLike?p.ru.label:p.en.label);
      b.onclick=()=>applyPreset(p);
      track.append(b);
    });
  });
  box.append(track);
}

function syncTuneUI(){
  document.querySelectorAll(".st").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===cur));
  document.querySelectorAll(".ps").forEach(x=>x.setAttribute("aria-pressed",x.dataset.id===curPreset));
  document.querySelectorAll("[data-lay]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lay===customLay));
  const pick=$("acpick");
  pick.value = /^#[0-9a-f]{6}$/i.test(customAc) ? customAc : TH[cur].ac;
  $("acrst").hidden = !customAc;
}

function buildForm(){
  const saved=store.get("if_form",{});
  $("form").innerHTML = ["ident","more"].map(g=>(g==="more"?`<details class="glass"><summary data-i="more"></summary>`:`<section class="glass"><h2 data-i="ident"></h2>`)+'<div class="fs">'+F.filter(f=>(G[f[0]]?"ident":"more")===g).map(f=>{
    if(f[0]==="niche"){
      return `<div class="w"><label for="f-niche" data-i="niche"></label><div class="niche-row"><input id="f-niche" autocomplete="off"><button type="button" class="btn p sm" id="autofill" data-i="autofill"></button></div></div>`;
    }
    return `<div class="${f[2]==="t"||f[0]==="img"||f[0]==="URL"||f[0]==="stats"||f[0]==="addr"?"w":""}"><label for="f-${f[0]}" data-i="${f[0]==="URL"?"siteurl":f[0]}"></label>${f[2]==="t"?`<textarea id="f-${f[0]}"></textarea>`:`<input id="f-${f[0]}" autocomplete="off">`}</div>`;
  }).join("")+(g==="ident"?`<div class="w"><label for="slang">🌐</label><select id="slang" aria-label="Site language">${Object.keys(L).map(k=>`<option value="${k}"${k===slang?" selected":""}>${{en:"English",ru:"Русский",uk:"Українська",pl:"Polski",de:"Deutsch",fr:"Français"}[k]}</option>`).join("")}</select></div>`:"")+(g==="more"?`<div class="w" style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="btn" id="up" data-i="upload"></button><button type="button" class="btn" id="rst" data-i="reset"></button><input type="file" id="file" accept="image/*" hidden><div class="thumb w" id="thumb"></div></div>`:"")+(g==="more"?`</div></details>`:`</div></section>`)).join("");
  F.forEach(f=>{ const el=$("f-"+f[0]); el.value = saved[f[0]] ?? f[1]; el.addEventListener("input",()=>{ save(); preview(); }); });
  $("autofill").onclick=smartAutofill;
  $("f-niche").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); smartAutofill(); } });
  $("slang").onchange=e=>{ slang=e.target.value; store.set("if_slang",slang); preview(); };
  $("up").onclick=()=>$("file").click(); $("file").onchange=e=>{ handlePhoto(e.target.files[0]); e.target.value=""; };
  $("rst").onclick=()=>{ F.forEach(f=>{ $("f-"+f[0]).value=f[1]; }); curPreset=""; customLay=""; customAc=""; photo=""; store.set("if_photo",""); store.set("if_lay",""); store.set("if_ac",""); save(); thumb(); syncTuneUI(); preview(); };
}

function applyLang(){
  document.documentElement.lang=lang; $("lang").value=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  $("stcnt").textContent=T("designs");
  renderPresets(); syncTuneUI(); renderBadge(); preview();
}

let PRICES={pro:500,host:300};
function loadPrices(){
  if(!API) return;
  fetch(API+"/prices?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(p=>{
    if(p.pro&&p.host){
      PRICES=p;
      if($("modal").classList.contains("on")){
        $("mprice").textContent=(MODAL_KIND==="host"?PRICES.host:PRICES.pro)+" ⭐";
      }
    }
    if(p.ai) $("aibox").hidden=false;
    if(p.trial) TRIAL_ON=true;
  }).catch(()=>{});
}
